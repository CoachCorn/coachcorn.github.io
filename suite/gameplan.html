<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gameplan</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1720">
<style>
:root{--bg:#0f1720;--card:#18232f;--line:#2a3948;--tx:#e8eef4;--mut:#8ea0b2;--acc:#9b7bff;--acc2:#3b9cff;--ok:#2fbf71;--warn:#f2b632;--bad:#ef5b5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px -apple-system,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{background:#102030;border:1px solid var(--line);border-radius:8px;padding:8px}
input[type=text],input:not([type]){min-width:0}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#0b1118;border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.btn{background:#223140;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:38px;text-transform:uppercase;font-weight:700;font-size:12px;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#120a2a}
.btn.bad{color:var(--bad)}.btn.dim{opacity:.55}.btn.sm{min-height:30px;padding:4px 9px;font-size:11px}
.sp{flex:1}
main{padding:12px;max-width:1200px;margin:0 auto}
.mut{color:var(--mut)}.note{color:var(--mut);font-size:12px}
.block{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;margin-bottom:16px;overflow:hidden}
.bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px}
.bh .nm{font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;width:min(300px,100%);flex:1 1 200px}
.bh .ps{width:130px}
.bm{display:flex;gap:12px;padding:0 12px 10px;flex-wrap:wrap;align-items:stretch}
.thumb{flex:0 0 440px;max-width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;position:relative;background:#101c14}
.thumb svg{display:block;width:100%;height:auto}
.thumb .tag{position:absolute;right:6px;bottom:6px;background:#000a;border-radius:6px;padding:2px 7px;font-size:11px;color:var(--mut);text-transform:uppercase}
.pd{flex:1 1 300px;background:#111c28;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pd .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:6px}
.pdg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pdg label{font-size:10px;text-transform:uppercase;color:var(--mut);display:block}
.pdg input{width:100%;padding:6px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;table-layout:fixed;min-width:560px}
th,td{border:1px solid var(--line);padding:0;vertical-align:top}
th{background:#111c28;text-align:left}
th .h{padding:7px 8px;font-weight:800;text-transform:uppercase;font-size:13px;cursor:pointer}
th .s{font-weight:500;color:var(--mut);font-size:11px;text-transform:none;display:block;min-height:13px}
th.rl{width:92px}
td.c{height:46px;cursor:pointer}td.c:active{background:#223140}
td .cc{padding:6px 8px;min-height:44px}
td .cc b{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.02em}
td .cc span{display:block;font-size:11px;color:var(--mut);text-transform:uppercase}
td .cc.empty{color:#3e5163;font-size:20px}
.rl{background:#111c28;cursor:pointer;padding:7px 8px;font-weight:700;font-size:12px;text-transform:uppercase;color:var(--mut)}
.addrow{padding:8px 12px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30}
.modal.show{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;width:min(560px,95vw);max-height:92vh;overflow:auto}
.box h3{margin:0 0 6px}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:10px 0 4px}
.box input[type=text],.box input:not([type]){width:100%;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:#223140;border:1px solid var(--line);border-radius:10px;padding:5px 10px;min-height:34px;font-weight:700;font-size:13px;text-transform:uppercase}
.chip.on{background:var(--acc);border-color:var(--acc);color:#120a2a}.chip.off{opacity:.5}
.slot{border-top:1px solid var(--line);padding:6px 0}
.slot .top{display:flex;gap:8px;align-items:center}.slot .top b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;min-width:120px}
.slot input{flex:1}
.full{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column}
.full.show{display:flex}
.fh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#0b1118;border-bottom:1px solid var(--line)}
.fb{flex:1;overflow:auto;display:flex;gap:12px;padding:12px;flex-wrap:wrap;align-items:flex-start}
.cv{flex:1 1 560px;min-width:300px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#101c14;touch-action:none}
.cv svg{display:block;width:100%;height:auto;touch-action:none}
.pn{flex:0 1 320px;min-width:260px}
.pn .g{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:10px}
.pn .g .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;display:inline-block;margin:4px 6px 0 0}.sw.on{border-color:var(--acc2)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:10px;z-index:60;display:none;max-width:90vw;text-align:center}
.empty{padding:30px;color:var(--mut);text-align:center}
.hint{background:#111c28;border:1px solid var(--acc);border-radius:10px;padding:8px 10px;margin-bottom:12px}.hint .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--acc);margin-bottom:6px}
.hrow{display:flex;gap:8px;align-items:flex-start;padding:4px 0}.hl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);min-width:78px;padding-top:4px}.hcs{display:flex;flex-wrap:wrap;gap:6px}
.hc{background:#18232f;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:13px}.hc b{text-transform:uppercase}.hc i{font-style:normal;font-weight:700}.hc i.g{color:var(--ok)}.hc i.r{color:var(--bad)}
@media print{.hint,.bhint{display:none}}
.hc.ng{border-color:var(--warn)}.hc em{font-style:normal;color:var(--warn);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.dont{display:flex;gap:8px;align-items:flex-start;padding:4px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--line)}.dont .hl{color:var(--warn)}
.hint summary{cursor:pointer;list-style:none}.hint summary::-webkit-details-marker{display:none}.hint summary .k{margin:0}.hint summary::after{content:' ▾';color:var(--mut)}.hint:not([open]) .ht,.hint:not([open]) .hmore,.hint:not([open]) .note{display:none}.hint[open] .hmore{display:none}.hint .hrow:first-of-type{margin-top:6px}
.hint .ht{width:100%;min-width:0;table-layout:auto;border-collapse:collapse;font-size:13px;margin-top:6px}.hint .ht th,.hint .ht td{border:0;background:none}.ht th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:6px 0 2px}.hint .ht td{padding:3px 0;border-top:1px solid var(--line)}.ht td:not(:first-child),.ht th:not(:first-child){text-align:right;padding-left:10px}.ht em{font-style:normal;color:var(--warn);font-size:11px;text-transform:uppercase}
.hint .ht i{font-style:normal;font-weight:700}.hint i.g{color:var(--ok)}.hint i.r{color:var(--bad)}
.hmore summary{font-size:12px;color:var(--mut);margin:6px 0 2px;cursor:pointer}.bhint{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}.bhint .hl{min-width:0;padding:0}
.look{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-top:1px solid var(--line);padding:5px 0;font-size:14px}.look:first-of-type{border-top:0}
.look b{text-transform:uppercase}.look .p{color:var(--mut);font-size:12px;white-space:nowrap}.fb2{color:var(--warn);font-size:12px}
@media print{
 :root{--bg:#fff;--card:#fff;--line:#999;--tx:#000;--mut:#444}
 body,html{background:#fff;color:#000}header,.addrow,.bh .btn,.act,.full,.modal,#toast,.noprint{display:none!important}
 .block{break-inside:avoid;border-color:#999;background:#fff}.thumb,.pd,th,.rl{background:#fff!important}
 input{border:0!important;background:none!important;color:#000!important}.thumb{background:#fff!important}
}
</style></head><body>
<header><h1>Gameplan</h1>
 <select id="plan" style="max-width:220px"></select>
 <button class="btn" id="pmore">Plans</button>
 <span class="sp"></span>
 <button class="btn pri" id="addb">+ Formation</button><button class="btn" id="addc">+ Column</button><button class="btn" id="addr">+ Row</button>
 <button class="btn" id="scout">Scout</button><button class="btn" id="looks">Draw all looks</button><button class="btn" id="mr">Send to Mental Reps</button><button class="btn" id="alm">Send to Almanac</button><button class="btn" id="prn">Print / PDF</button>
</header>
<main id="main"></main>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="full" id="ed"></div>
<div id="toast"></div>
<script src="../shared/glossary.js"></script>
<script src="../shared/scout.js"></script>
<script>
/* Gameplan grid (Staff Meeting). Coach-defined plan: columns and rows are whatever the coach types,
   each formation block holds a drawing, a predicted-defense strip and a grid of calls.
   Stored on the device under gameplan_v1_<program> and synced by suite/sync.js as the 'gameplan' document
   (whole plan, newest edit wins). Standalone: nothing here feeds the Almanac until Noah says so. */
const PROGRAM=!signedIn()?'demo':(new URLSearchParams(location.search).get('program')||(()=>{try{return(JSON.parse(localStorage.getItem('suite_sync'))||{}).program||'deer-creek'}catch(e){return'deer-creek'}})());
addEventListener('storage',e=>{if(e.key==='suite_sync'){let n=false;try{const x=JSON.parse(e.newValue);n=!!(x&&x.token&&x.exp>Date.now())}catch(_){}if(n!==signedIn())location.reload()}});
const KEY='gameplan_v1_'+PROGRAM;
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}

/* ---------- storage ---------- */
function signedIn(){try{const x=JSON.parse(localStorage.getItem('suite_sync'))||{};return!!(x.token&&x.exp>Date.now())}catch(e){return false}}
const OFF=40;   // the line of scrimmage sits 40 px (about 3 yards) lower than in version 1 drawings, so the defense has room
function migDraw(d){if(!d||!d.t||d.v>=2)return;Object.values(d.t).forEach(p=>{if(p&&typeof p.y==='number')p.y+=OFF});(d.l||[]).forEach(l=>(l.pts||[]).forEach(q=>{q[1]+=OFF}));d.v=2}
function migStore(s){(s.rows||[]).forEach(p=>(p.blocks||[]).forEach(b=>{migDraw(b.draw);Object.values(b.cells||{}).forEach(c=>{if(c&&c.look){migDraw(c.look.d);migDraw(c.look.gen)}})}));return s}
let ST=readStore();
function readStore(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.rows))return migStore(s)}catch(e){}return{rows:[],deleted:[]}}
function writeStore(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){toast('Could not save on this device')}}
let cur=null;
function plan(){return ST.rows.find(p=>p.id===cur)||ST.rows[0]||null}
function touch(p){p.upd=Date.now();writeStore()}

/* ---------- drawing data ---------- */
const OLK=['LT','LG','C','RG','RT'],SK=['Q','X','Z','M','H','Y','F','A','B','T'];
const COLS=['#ffffff','#ef5b5b','#5aa9ff','#f2b632','#2fbf71','#c58bff'];
const TC={Q:'#ffffff',X:'#5aa9ff',Z:'#5aa9ff',M:'#f2b632',H:'#2fbf71',Y:'#c58bff',F:'#5ad1c8',A:'#ff9bd0',B:'#b0b8c4',T:'#ef7b5b'};
/* The drawing is the whole field width: 160 ft (high school), 4.4 px per foot. The left hash sits where the center lines up (53'4" from the sideline).
   Noah asked for the hashes drawn farther apart than real: HASHR puts the right hash 66 ft from the left one (real is 53'4"). Change the 66 to change it.
   Numbers are 6 ft tall: top 9 yards (27 ft) from the sideline, bottom 21 ft. */
const PXFT=4.4,YD=3*PXFT,LOS=110+OFF,VW=Math.round(160*PXFT),VH=250+OFF,HASHX=Math.round(53.333*PXFT),HASHR=HASHX+Math.round(66*PXFT),NSHIFT=4,NB=Math.round((21-NSHIFT)*PXFT),NT=Math.round((27-NSHIFT)*PXFT); // numbers drawn NSHIFT ft closer to the sideline than the NFHS spec, at Noah's request
const L1=LOS-28,L2=LOS-58,L3=LOS-100,DP={
 '4-3-4':[['DE1','DE',163,L1],['DT1','DT',211,L1],['DT2','DT',259,L1],['DE2','DE',307,L1],['WL','W',170,L2],['ML','M',235,L2],['SL','S',300,L2],['CB1','CB',40,LOS-55],['CB2','CB',450,LOS-55],['FS','FS',205,L3],['SS','SS',265,L3]],
 '3-4-4':[['DE1','DE',163,L1],['NT','NT',235,L1],['DE2','DE',307,L1],['OL1','W',105,LOS-40],['IL1','M',205,L2],['IL2','M',265,L2],['OL2','S',365,LOS-40],['CB1','CB',40,LOS-55],['CB2','CB',450,LOS-55],['FS','FS',205,L3],['SS','SS',265,L3]],
 '3-3-5':[['DE1','DE',163,L1],['NT','NT',235,L1],['DE2','DE',307,L1],['WL','W',175,L2],['ML','M',235,L2],['SL','S',295,L2],['CB1','CB',40,LOS-55],['CB2','CB',450,LOS-55],['FS','FS',205,L3],['SS','SS',265,L3],['NB','N',350,LOS-42]],
 '4-2-5':[['DE1','DE',163,L1],['DT1','DT',211,L1],['DT2','DT',259,L1],['DE2','DE',307,L1],['WL','W',205,L2],['ML','M',265,L2],['CB1','CB',40,LOS-55],['CB2','CB',450,LOS-55],['FS','FS',205,L3],['SS','SS',265,L3],['NB','N',350,LOS-42]]};
function addDefense(t,pre){pre=DP[pre]?pre:'4-3-4';Object.keys(t).forEach(k=>{if(t[k].df)delete t[k]});DP[pre].forEach(([k,lab,x,y])=>{t['D_'+k]={x,y,on:1,df:1,lab}});return pre}
const OLSP=36;   // spacing between offensive linemen
function baseDraw(){const t={},put=(k,x,y,on)=>t[k]={x,y,on};
 put('X',30,114+OFF,1);put('Z',456,112+OFF,1);put('M',165,150+OFF,1);put('Q',235,168+OFF,1);put('T',210,205+OFF,1);put('H',385,128+OFF,1);
 put('Y',395,112+OFF,0);put('F',430,150+OFF,0);put('A',300,190+OFF,0);put('B',260,205+OFF,0);
 OLK.forEach((k,i)=>put(k,235-2*OLSP+i*OLSP,LOS,1));return{t,l:[],v:2}}
let svgN=0;
function pathD(pts,curve){const P=pts.map(p=>[+p[0],+p[1]]);if(!curve||P.length<3)return'M'+P.map(p=>p[0]+' '+p[1]).join(' L');let d='M'+P[0][0]+' '+P[0][1];
 for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;d+=' C'+(p1[0]+(p2[0]-p0[0])/6)+' '+(p1[1]+(p2[1]-p0[1])/6)+','+(p2[0]-(p3[0]-p1[0])/6)+' '+(p2[1]-(p3[1]-p1[1])/6)+','+p2[0]+' '+p2[1]}return d}
function svgOf(d,sel,cur,selL){const n=++svgN,used=new Set(),edit=selL!==undefined;
 const lines=(d.l||[]).concat(cur?[cur]:[]);lines.forEach(l=>used.add(l.col||'#ffffff'));
 let s=`<svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg"><defs>`+[...used].map(c=>`<marker id="a${n}${c.slice(1)}" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="${c}"/></marker>`).join('')+`</defs>`;
 s+=`<rect width="${VW}" height="${VH}" fill="#101c14"/>`;
 const lab=(x,y,t,an)=>`<text x="${x}" y="${y}" fill="#ffffff66" font-size="9" font-family="sans-serif" text-anchor="${an||'middle'}">${t}</text>`;
 for(let k=-12;k<=12;k++){const y=LOS+k*5*YD;if(y>2&&y<VH-2)s+=`<line x1="0" x2="${VW}" y1="${y}" y2="${y}" stroke="#ffffff14"/>`}   // 5-yard lines
 // numbers: 6 ft tall, top 9 yards in, bottom 7 yards in, both sides
 s+=`<line x1="1" x2="1" y1="0" y2="${VH}" stroke="#ffffff77" stroke-width="2"/><line x1="${VW-1}" x2="${VW-1}" y1="0" y2="${VH}" stroke="#ffffff77" stroke-width="2"/>`;
 // hash marks, a tick every yard, longer every 5
 for(const hx of [HASHX,HASHR])for(let k=-12;k<=12;k++){const y=LOS+k*YD;if(y<3||y>VH-2)continue;const w=k%5===0?18:9;s+=`<line x1="${hx-w/2}" x2="${hx+w/2}" y1="${y}" y2="${y}" stroke="#ffffff66" stroke-width="1.4"/>`}
 // yard numerals (6 ft tall), both read bottom to top: 4 on the bottom, 0 on top
 for(const [cx,rot] of [[(NB+NT)/2,-90],[VW-(NB+NT)/2,-90]])s+=`<text x="${cx}" y="${LOS}" transform="rotate(${rot} ${cx} ${LOS})" fill="#ffffff26" font-size="36" font-weight="700" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" letter-spacing="3">40</text>`;
 s+=`<line x1="0" x2="${VW}" y1="${LOS}" y2="${LOS}" stroke="#ffffff55" stroke-dasharray="6 5"/>`;
 for(let li=0;li<lines.length;li++){const l=lines[li],c=l.col||'#ffffff',pts=(l.pts||[]).map(p=>p.join(',')).join(' '),pd=pathD(l.pts||[],l.curve);if((l.pts||[]).length<2)continue;
  s+=`<path d="${pd}" fill="none" stroke="${c}" stroke-width="${l.dot?3:2.6}" stroke-linecap="round" stroke-linejoin="round" ${l.dot?'stroke-dasharray="1 7"':''} ${l.arrow&&!l.blk?`marker-end="url(#a${n}${c.slice(1)})"`:''}/>`+(l.blk?(()=>{const q=l.pts,a=q[q.length-2],z=q[q.length-1],dx=z[0]-a[0],dy=z[1]-a[1],m=Math.hypot(dx,dy)||1,px=-dy/m*9,py=dx/m*9;return`<line x1="${z[0]-px}" y1="${z[1]-py}" x2="${z[0]+px}" y2="${z[1]+py}" stroke="${c}" stroke-width="3.4" stroke-linecap="round"/>`})():'')+(edit&&li<d.l.length?(selL===li?`<path d="${pd}" fill="none" stroke="#9b7bff" stroke-width="9" stroke-opacity=".4" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>`:'')+`<path data-l="${li}" d="${pd}" fill="none" stroke="transparent" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" pointer-events="stroke"/>`:'')}
 for(const k of Object.keys(d.t).filter(k=>d.t[k].df&&d.t[k].on)){const t=d.t[k];s+=`<g data-k="${k}">${sel===k?`<circle cx="${t.x}" cy="${t.y}" r="17" fill="none" stroke="#9b7bff" stroke-width="2.5"/>`:''}<circle cx="${t.x}" cy="${t.y}" r="12" fill="#2a1416" stroke="#ef5b5b" stroke-width="1.8"/><text x="${t.x}" y="${t.y+3.5}" text-anchor="middle" font-size="9.5" font-weight="800" font-family="sans-serif" fill="#ff8c8c" pointer-events="none">${t.lab||''}</text></g>`}
 const order=[...OLK,...SK];
 for(const k of order){const t=d.t[k];if(!t||!t.on)continue;const ol=OLK.includes(k),c=TC[k]||'#fff';
  s+=`<g data-k="${k}" ${sel===k?'':''}>${sel===k?`<circle cx="${t.x}" cy="${t.y}" r="17" fill="none" stroke="#9b7bff" stroke-width="2.5"/>`:''}<circle cx="${t.x}" cy="${t.y}" r="12" fill="${ol?'#101c14':c}" stroke="${ol?'#e8eef4':'#0008'}" stroke-width="${ol?1.8:1}"/><text x="${t.x}" y="${t.y+4.5}" text-anchor="middle" font-size="12.5" font-weight="800" font-family="sans-serif" fill="${ol?'#e8eef4':'#0b1118'}" pointer-events="none">${ol?'O':k}</text></g>`}
 if(edit&&selL!=null&&d.l[selL]){const q=d.l[selL].pts;for(let j=0;j<q.length-1;j++)s+=`<circle data-m="${selL}:${j}" cx="${(q[j][0]+q[j+1][0])/2}" cy="${(q[j][1]+q[j+1][1])/2}" r="8" fill="#101c14" fill-opacity=".6" stroke="#9b7bff" stroke-width="2" stroke-dasharray="3 2"/>`}

/* ---------- Draw all looks (first version: formation tags and motions only; routes and play tags are listed but not drawn yet) ---------- */
// Rules taught by Noah: Heavy, Lite, Outside, Stooge, Map. g:true = a first guess that still needs his definition.
const dir=(t)=>t.H&&t.H.x>t.Q.x?-1:1;   // motion goes away from the side the player starts on
const on=(t,k,x,y)=>{const p=t[k]||(t[k]={x,y,on:1});if(!p.on){p.on=1;p.x=x;p.y=y}return p};
const LOOK={
 ftag:{
  HEAVY:t=>{t.RT.x=t.LT.x-OLSP;t.RT.y=LOS},
  LITE:t=>{t.LT.x=t.RT.x+OLSP;t.LT.y=LOS},
  OUTSIDE:t=>{t.Z.x=HASHR+8;t.Z.y=LOS;t.X.x=HASHR-24;t.X.y=LOS},
  STOOGE:t=>{const h=on(t,'H',t.Q.x+30,t.Q.y);h.x=t.Q.x+30;h.y=t.Q.y},
  TIGHT:{g:1,fn:t=>{const h=on(t,'H',t.RT.x+30,LOS),y=on(t,'Y',t.RT.x+60,LOS);h.x=t.RT.x+36;h.y=LOS+26;y.x=t.RT.x+30;y.y=LOS;t.Z.x=t.RT.x+62;t.Z.y=LOS}},
  STACK:{g:1,fn:t=>{const h=on(t,'H',t.Z.x,t.Z.y+24);h.x=t.Z.x;h.y=t.Z.y+24}},
  BUNCH:{g:1,fn:t=>{const h=on(t,'H',t.Z.x-20,t.Z.y+12),y=on(t,'Y',t.Z.x-20,t.Z.y-12);t.Z.y=LOS;y.x=t.Z.x-28;y.y=LOS;h.x=t.Z.x-14;h.y=LOS+24}}},
 motion:{
  MAP:(t,L)=>{const m=t.M,x0=HASHX-45;m.x=x0;L.push({pts:[[x0,m.y],[HASHR+5*YD,LOS+20]],dot:1,arrow:1,col:'#3b9cff'})},
  JET:{g:1,fn:(t,L)=>{const h=on(t,'H',385,128+OFF),d=dir(t),x1=d<0?HASHX-30:HASHR+30;L.push({pts:[[h.x,h.y],[t.Q.x,LOS+38],[x1,LOS+38]],dot:1,arrow:1,col:'#3b9cff'})}},
  FLY:{g:1,fn:(t,L)=>{const h=on(t,'H',385,128+OFF),d=dir(t),x1=d<0?HASHX-30:HASHR+30;L.push({pts:[[h.x,h.y],[x1,h.y]],dot:1,arrow:1,col:'#3b9cff'})}},
  ORBIT:{g:1,fn:(t,L)=>{const h=on(t,'B',260,205+OFF),d=h.x<t.Q.x?1:-1,x1=d>0?HASHR+10:HASHX-10;L.push({pts:[[h.x,h.y],[t.Q.x,Q_B(t)],[x1,t.Q.y+8]],dot:1,arrow:1,col:'#3b9cff'})}}}};
const Q_B=t=>t.Q.y+48;
/* ---- read the glossary wording: plain sentences turned into moves. Anything it cannot read is reported back, never guessed. ---- */
const PNAME={'left tackle':'LT','right tackle':'RT','left guard':'LG','right guard':'RG','center':'C','quarterback':'Q'};
const PTOK='(LT|LG|RG|RT|Q|X|Z|M|H|Y|F|A|B|T|C)';
function normDef(x){let t=String(x||'').replace(/\([^)]*\)/g,' ');for(const k in PNAME)t=t.replace(new RegExp('\\b'+k+'\\b','gi'),PNAME[k]);t=t.replace(/\b(?:boundary|field)\s+(?=(?:LT|LG|RG|RT|Q|X|Z|M|H|Y|F|A|B|T|C)\b)/gi,'');return t.replace(/,/g,' ').replace(/\s+/g,' ').trim()}
const SIDEX=sd=>/^(left|boundary)$/i.test(sd)?HASHX:HASHR;
function parseDef(text){const ok=[],bad=[],steps=[];let subj=null;
 const clauses=normDef(text).split(/\s*(?:;|\.\s|\.$|\bthen\b)\s*/i).map(x=>x.trim()).filter(Boolean);
 const players=str=>(str.match(new RegExp('\\b'+PTOK+'\\b','g'))||[]);
 for(let cl of clauses){let m,P;
  if(/\b(snaps?|snapped)\b|^tackle over$|^the mirror/i.test(cl)){ok.push(cl);continue}
  if((m=cl.match(new RegExp('^((?:'+PTOK+'(?:/|\\s*and\\s*)?)+)\\s+(?:moves?|goes|slides?|lines? up|shifts?|aligns?|sets?)\\s+(?:over\\s+)?(?:to|on|at)\\s+(?:the\\s+)?(left|right|field|boundary)(?:\\s+(?:side|hash))?(.*)$')))){
   P=players(m[1]);const sd=m[2],ball=/on the (?:ball|line)/i.test(m[3]||'');subj=P[P.length-1];
   steps.push((t)=>{P.forEach((k,i)=>{const p=on(t,k,235,LOS);
    if(/^(LT|LG|RG|RT|C)$/.test(k)){const xs=OLK.filter(o=>o!==k).map(o=>t[o].x);p.x=/^(left|boundary)$/i.test(sd)?Math.min(...xs)-OLSP:Math.max(...xs)+OLSP;p.y=LOS}
    else{const out=/^(left|boundary)$/i.test(sd)?-1:1,n=P.length-1-i;p.x=SIDEX(sd)+out*(n*32)+(out>0?8:-8)+(P.length>1?0:0);if(ball)p.y=LOS}})});ok.push(cl);continue}
  if((m=cl.match(new RegExp('^'+PTOK+'\\s+(?:in|into)\\s+the\\s+backfield\\s+(beside|next to|behind)\\s+'+PTOK)))){subj=m[1];const A=m[1],B=m[3],how=m[2];
   steps.push(t=>{const p=on(t,A,t[B].x,t[B].y);p.x=how==='behind'?t[B].x:t[B].x+30;p.y=how==='behind'?t[B].y+28:t[B].y});ok.push(cl);continue}
  if((m=cl.match(new RegExp('^'+PTOK+'\\s+(?:stacked\\s+)?(behind|beside|next to|inside|outside)\\s+'+PTOK)))){subj=m[1];const A=m[1],how=m[2],B=m[3];
   steps.push(t=>{const q=t[B],p=on(t,A,q.x,q.y),side=q.x>=t.Q.x?1:-1;p.x=how==='behind'?q.x:how==='inside'?q.x-side*28:how==='outside'?q.x+side*28:q.x+side*28;p.y=how==='behind'?q.y+24:q.y});ok.push(cl);continue}
  if((m=cl.match(new RegExp('^'+PTOK+'\\s+(?:starts?|begins?|lines? up)\\s+(?:on the other side|opposite)')))){subj=m[1];const A=m[1];steps.push(t=>{const p=on(t,A,235,150+OFF);p.x=2*t.Q.x-p.x});ok.push(cl);continue}
  if((m=cl.match(new RegExp('^'+PTOK+'\\s+on\\s+the\\s+(?:line|ball)')))){subj=m[1];const A=m[1];steps.push(t=>{on(t,A,235,LOS).y=LOS});ok.push(cl);continue}
  if((m=cl.match(new RegExp('^(?:'+PTOK+'\\s+)?(?:fast\\s+|quick\\s+)?(?:motions?|runs|goes)\\s+(?:in motion\\s+)?(?:to|across|toward)\\s+(?:the\\s+)?(left|right|field|boundary|landing spot|spot|call)?')))){const A=m[1]||subj;if(!A){bad.push(cl);continue}const sd=m[2];

  else if(!k&&C.c){snap();const D=T[C.b];E.d.l.push({pts:[[D.x,D.y-14],[p0.x,p0.y]],blk:1,col:E.col});E.combo={a:null,b:null,c:null};E.sel=null}
  redrawCanvas();edRender();e.preventDefault();return}
 // line mode
 if(g&&!E.cur){E.sel=g.dataset.k;redrawCanvas();edRender();return}
 if(!E.cur){if(!E.sel||!E.d.t[E.sel]||!E.d.t[E.sel].on)return;const t=E.d.t[E.sel];E.cur={pts:[[t.x,t.y]],dot:E.dot,arrow:E.arrow&&!E.blk,blk:E.blk,curve:E.curve,col:E.col}}
 E.cur.pts.push([p0.x,p0.y]);E.cur.dot=E.dot;E.cur.arrow=E.arrow&&!E.blk;E.cur.blk=E.blk;E.cur.curve=E.curve;E.cur.col=E.col;redrawCanvas();edRender();e.preventDefault()});
$('ed').addEventListener('pointermove',e=>{if(!E||!E.drag)return;const d=E.drag,p1=pt(e),dx=p1.x-d.p0.x,dy=p1.y-d.p0.y;
 if(d.kind==='pt')E.d.l[d.li].pts[d.pi]=[p1.x,p1.y];
 else if(d.kind==='ln'){const xs=d.orig.map(q=>q[0]),ys=d.orig.map(q=>q[1]),mx=Math.max(8-Math.min(...xs),Math.min(VW-8-Math.max(...xs),dx)),my=Math.max(8-Math.min(...ys),Math.min(VH-8-Math.max(...ys),dy));E.d.l[d.li].pts=d.orig.map(q=>[q[0]+mx,q[1]+my])}
 else for(const k in d.start){const s0=d.start[k],t=E.d.t[k];t.x=Math.max(8,Math.min(VW-8,s0.x+dx));t.y=Math.max(8,Math.min(VH-8,s0.y+dy))}
 redrawCanvas()});
const endDrag=()=>{if(E&&E.drag){E.drag=null;if(E.hist.length&&JSON.stringify(E.d)===E.hist[E.hist.length-1])E.hist.pop();edRender()}};
$('ed').addEventListener('pointerup',endDrag);$('ed').addEventListener('pointercancel',endDrag);
$('ed').addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(!b||!E)return;const a=b.dataset.e,t=E.d.t;
 if(a==='cancel'){const lk=E.look;E=null;$('ed').classList.remove('show');if(lk)$('looks').onclick();return}
 if(a==='save'){finishLine();const p=plan(),lk=E.look;if(lk){const c=p.blocks[E.bi].cells[lk.key];if(c){const was=c.look||{};c.look=Object.assign({},was,{d:E.d,gen:lk.gen,edited:true,at:Date.now()})}}else p.blocks[E.bi].draw=E.d;touch(p);E=null;$('ed').classList.remove('show');render();if(lk)$('looks').onclick();return}
 if(a==='pl'){const k=b.dataset.k;snap();t[k].on=t[k].on?0:1;if(E.sel===k&&!t[k].on)E.sel=null}
 else if(a==='grp')E.grp=true;else if(a==='one')E.grp=false;
 else if(a==='lite'){snap();t.LT.x=t.RT.x+OLSP;t.LT.y=LOS}
 else if(a==='heavy'){snap();t.RT.x=t.LT.x-OLSP;t.RT.y=LOS}
 else if(a==='reset'){snap();const bd=baseDraw();OLK.forEach(k=>t[k]=bd.t[k])}
 else if(a==='mm'){finishLine();E.mode='move';E.combo=null}else if(a==='ml'){E.mode='line';E.selL=null;E.combo=null}else if(a==='mc'){finishLine();E.mode='combo';E.combo={a:null,b:null,c:null};E.selL=null;E.sel=null}
 else if(a==='done')finishLine();
 else if(a==='solid'){E.dot=false;if(E.cur)E.cur.dot=false;if(E.selL!=null){snap();E.d.l[E.selL].dot=false}}else if(a==='dotted'){E.dot=true;if(E.cur)E.cur.dot=true;if(E.selL!=null){snap();E.d.l[E.selL].dot=true}}
 else if(a==='arrow'){E.arrow=!E.arrow;if(E.arrow)E.blk=false;if(E.cur){E.cur.arrow=E.arrow;E.cur.blk=E.blk}if(E.selL!=null){snap();E.d.l[E.selL].arrow=E.arrow;E.d.l[E.selL].blk=E.blk}}
 else if(a==='blk'){E.blk=!E.blk;if(E.blk)E.arrow=false;if(E.cur){E.cur.blk=E.blk;E.cur.arrow=E.arrow}if(E.selL!=null){snap();E.d.l[E.selL].blk=E.blk;E.d.l[E.selL].arrow=E.arrow}}
 else if(a==='curve'){E.curve=!E.curve;if(E.cur)E.cur.curve=E.curve;if(E.selL!=null){snap();E.d.l[E.selL].curve=E.curve}}
 else if(a==='defp'){snap();E.d.dp=addDefense(t,b.dataset.p)}else if(a==='defoff'){snap();Object.values(t).forEach(x=>{if(x.df)x.on=0});if(E.sel&&String(E.sel).indexOf('D_')===0)E.sel=null}
 else if(a==='col'){E.col=b.dataset.c;if(E.cur)E.cur.col=E.col;if(E.selL!=null){snap();E.d.l[E.selL].col=E.col}}
 else if(a==='dellsel'){if(E.selL!=null){snap();E.d.l.splice(E.selL,1);E.selL=null}}
 else if(a==='undo'){if(E.cur){E.cur=null}else if(E.hist.length){E.d=JSON.parse(E.hist.pop());E.selL=null}}
 else if(a==='dellast'){snap();E.d.l.pop();E.selL=null}
 else if(a==='clear'){snap();E.d.l=[];E.cur=null;E.selL=null}
 edRender()});

addEventListener('keydown',e=>{if(!E||!$('ed').classList.contains('show'))return;if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName||''))return;
 if((e.key==='Backspace'||e.key==='Delete')&&E.selL!=null&&E.d.l[E.selL]){e.preventDefault();snap();E.d.l.splice(E.selL,1);E.selL=null;redrawCanvas();edRender()}});
/* ---------- boot ---------- */
function boot(){ST=readStore();try{cur=localStorage.getItem('gp_cur')||null}catch(e){}
 if(signedIn()&&ST.rows.some(p=>p.sample)){ST.rows=ST.rows.filter(p=>!p.sample);writeStore()}   // signed in: the demo plan goes away, the coaches' plans load from sync
 if(!signedIn()&&ST.rows.some(p=>p.sample&&p.dv!==3)){ST.rows=ST.rows.filter(p=>!(p.sample&&p.dv!==3));ST.rows.unshift(samplePlan());writeStore()}   // demo vocabulary changed: swap an out-of-date sample week for the current one, leave the coach's own plans alone
 if(!signedIn()&&!ST.rows.length&&!(ST.deleted||[]).length){ST.rows.push(samplePlan());writeStore()}
 render()}
addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.gameplan==='changed'&&!E&&!$('modal').classList.contains('show')){ST=readStore();render()}});
addEventListener('storage',e=>{if(!E&&!$('modal').classList.contains('show')){if(e.key===KEY){ST=readStore();render()}else if(e.key==='almanac_v1')render()}});
boot();
</script></body></html>
