<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stats</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#0f1720;--card:#18232f;--line:#2a3948;--tx:#e8eef4;--mut:#8ea0b2;--acc:#3b9cff;--ok:#2fbf71;--warn:#f2b632;--bad:#ef5b5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px -apple-system,system-ui,sans-serif}
button,input,select{font:inherit;color:var(--tx)}
header{position:sticky;top:0;z-index:3;background:#0b1118;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tab{background:transparent;border:1px solid transparent;border-radius:9px;padding:7px 13px;font-weight:700;text-transform:uppercase;font-size:13px;color:var(--mut)}
.tab.on{background:var(--card);border-color:var(--line);color:#fff}
header .sp{flex:1}
select,input[type=text],input[type=date],input[type=number]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
main{max-width:980px;margin:0 auto;padding:14px 12px 40px}
.rec{display:flex;align-items:baseline;gap:10px;margin:4px 0 14px}.rec b{font-size:28px}.rec span{color:var(--mut)}.rec{flex-wrap:nowrap;align-items:center;gap:8px}.rec b{font-size:24px;white-space:nowrap}.rec span{font-size:13px;white-space:nowrap}.rec .btn{padding:6px 10px;font-size:13px;min-height:0;white-space:nowrap;flex:none}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left}
.logo{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:17px;letter-spacing:.02em;overflow:hidden;color:#fff}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.row .mid{flex:1;min-width:0}.row .opp{font-size:18px;font-weight:800}.row .opp small{font-weight:600;color:var(--mut);font-size:14px;margin-right:4px}
.row .meta{color:var(--mut);font-size:13px;margin-top:2px}
.row .res{flex:none;text-align:right;font-weight:800;font-size:17px}.res .w{color:var(--ok)}.res .l{color:var(--bad)}.res .t{color:var(--mut)}.res small{display:block;font-size:12px;color:var(--mut);font-weight:600}
.cd{color:var(--warn)}
.btn{background:#223140;border:1px solid var(--line);border-radius:8px;padding:9px 14px;min-height:40px;text-transform:uppercase;font-weight:700;font-size:13px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
@media(max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
.t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.t b{display:block;font-size:22px}.t span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:20px 0 6px}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{font-size:11px;text-transform:uppercase;color:var(--mut);text-align:right;padding:7px 8px;background:#132030}th:first-child,td:first-child{text-align:left}
td{padding:7px 8px;border-top:1px solid var(--line);text-align:right}
tr.click{cursor:pointer}tr.click:active{background:#223140}
.dd{font-size:12px;line-height:1.15;margin-top:1px}.cmp{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:600;text-transform:none;letter-spacing:0;white-space:nowrap}.cmp input{width:18px;height:18px;margin:0;accent-color:#2fbf71}.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}.sh h3{margin:18px 0 8px}.up{color:var(--ok);font-weight:700}.dn{color:var(--bad);font-weight:700}.mut{color:var(--mut)}.note{color:var(--mut);font-size:12px}
.empty{color:var(--mut);padding:30px 10px;text-align:center}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}.modal.show{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(480px,94vw);max-height:90vh;overflow:auto}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:#223140;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--tx)}.chip i{font-style:normal;color:var(--mut);font-weight:500;margin-left:2px}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}.chip.on i{color:#dbeaff}
.seg{display:flex;gap:6px}.seg button{flex:1;background:#223140;border:1px solid var(--line);border-radius:8px;padding:8px;font-weight:700}.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style></head><body>
<header id="hdr"></header>
<main id="main"></main>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<script src="../shared/demoseed.js"></script>
<script src="../shared/importer.js"></script>
<script>
/* Stats + schedule. Reads the Almanac's games from this device (kept in step by sync) and the program schedule.
   Efficiency: 1st down 4+ (or the distance if shorter), 2nd down half the distance (rounded up), 3rd/4th convert, TD always.
   Explosive: the program's thresholds (Almanac > Setup > Explosive run / pass; default 15+ on any play). */
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ALMK=()=>{try{const s=JSON.parse(localStorage.getItem('suite_sync'));return(s&&s.token&&s.exp>Date.now())?'almanac_v1':'almanac_demo'}catch(e){return'almanac_demo'}};
const prog=()=>{try{return ALMK()==='almanac_v1'?((JSON.parse(localStorage.getItem('suite_sync'))||{}).program||'deer-creek'):'demo'}catch(e){return'demo'}};
const PL=j=>(window.DemoSeed&&ALMK()==='almanac_demo')?esc(DemoSeed.label(j)):'#'+esc(j);
const SKEY=()=>'schedule_v1_'+prog();
let V={tab:'schedule',game:null,season:null};
function A(){try{return JSON.parse(localStorage.getItem(ALMK()))||{games:[],lists:{}}}catch(e){return{games:[],lists:{}}}}
function sched(){try{return JSON.parse(localStorage.getItem(SKEY()))||{rows:[],deleted:[]}}catch(e){return{rows:[],deleted:[]}}}
function saveSched(S){S.rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));localStorage.setItem(SKEY(),JSON.stringify(S))}
const newId=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const U=x=>String(x||'').trim().toUpperCase();
/* ---------- games and plays ---------- */
const realGames=a=>(a.games||[]).filter(g=>!g.demo&&!/\(other iPad\)$/.test(g.opp||''));
function gameYear(g,S){const r=S.rows.find(x=>x.game===g.id||(!x.game&&U(x.opp)===U(g.opp)));if(r&&r.date)return+r.date.slice(0,4);const t=parseInt(String(g.id).slice(1),10);return t>1e12?new Date(t).getFullYear():new Date().getFullYear()}
function rowFor(g,S){return S.rows.find(x=>x.game===g.id)||S.rows.find(x=>!x.game&&U(x.opp)===U(g.opp))}
function plays(gs){return gs.flatMap(g=>(g.plays||[]).filter(p=>p.k==='p'&&p.result!=='PEN').map(p=>Object.assign({_g:g.id},p)))}
function eff(p){if(p.td)return 1;const g=+p.gain||0,n=+p.dist||10;if(p.down===1)return g>=(n>=10?4:n)?1:0;if(p.down===2)return g>=Math.ceil(n/2)?1:0;return g>=n?1:0}
function expl(p,L){const t=p.ptype==='run'?(L.expRun||15):(L.expPass||15);return(+p.gain||0)>=t?1:0}
function summ(P,L){const n=P.length,y=P.reduce((a,p)=>a+(+p.gain||0),0),e=P.reduce((a,p)=>a+eff(p),0),x=P.reduce((a,p)=>a+expl(p,L),0),r=P.filter(p=>p.ptype==='run').length;
 return{n,ypp:n?y/n:0,eff:n?e/n:0,exp:n?x/n:0,run:n?r/n:0,yds:y,to:P.filter(p=>p.result==='INT'||p.result==='FUM').length,td:P.filter(p=>p.td).length}}
const pct=v=>Math.round(v*100)+'%',f1=v=>(Math.round(v*10)/10).toFixed(1);
function delta(v,avg,isPct,n,show){const val=isPct?pct(v):f1(v);if(show===false||n<3)return`<span class="${n<3?'mut':''}">${val}</span>`;const d=isPct?Math.round((v-avg)*100):Math.round((v-avg)*10)/10;
 const s=d===0?(isPct?'0%':'0.0'):(d>0?'+':'')+(isPct?d+'%':d.toFixed(1));return`<div>${val}</div><div class="dd ${d>0?'up':d<0?'dn':'mut'}">${s}</div>`}
/* +/- vs the season average can be switched off per grid in Splits (and all at once). Saved on this device. */
const CMPK='stats_cmp_v1';let CMP={};try{CMP=JSON.parse(localStorage.getItem(CMPK))||{}}catch(e){CMP={}}
const cmpOn=id=>!CMP[id];function cmpSave(){try{localStorage.setItem(CMPK,JSON.stringify(CMP))}catch(e){}}
/* ---------- header ---------- */
function seasons(){const a=A(),S=sched(),ys=new Set([...S.rows.map(r=>+String(r.date||'').slice(0,4)).filter(Boolean),...realGames(a).map(g=>gameYear(g,S))]);if(!ys.size)ys.add(new Date().getFullYear());return[...ys].sort((x,y)=>y-x)}
function hdr(){const ss=seasons();if(!V.season||!ss.includes(V.season))V.season=ss[0];
 $('hdr').innerHTML=[['schedule','Schedule'],['season','Season'],['games','By game'],['splits','Splits']].map(([k,l])=>`<button class="tab ${V.tab===k&&!V.game?'on':''}" data-tab="${k}">${l}</button>`).join('')+`<span class="sp"></span><select id="ssel">${ss.map(y=>`<option ${y===V.season?'selected':''}>${y}</option>`).join('')}</select>`;
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{V.tab=b.dataset.tab;V.game=null;render()});$('ssel').onchange=e=>{V.season=+e.target.value;render()}}
/* ---------- schedule ---------- */
const initials=n=>String(n||'?').replace(/[^A-Za-z ]/g,'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,3).toUpperCase()||'?';
const logoHtml=r=>`<span class="logo" style="background:${r.logo?'#fff':(r.color||'#3b4b5c')}">${r.logo?`<img src="${r.logo}" alt="">`:esc(initials(r.opp))}</span>`;
function result(r){if(r.us!=null&&r.us!==''&&r.them!=null&&r.them!==''){const u=+r.us,t=+r.them,c=u>t?'w':u<t?'l':'t';return`<span class="${c}">${u>t?'W':u<t?'L':'T'} ${u}–${t}</span>`}
 if(!r.date)return'';const d=Math.round((new Date(r.date+'T12:00')-new Date(new Date().toDateString()+' 12:00'))/864e5);
 return d===0?'<span class="cd">Today</span>':d===1?'<span class="cd">Tomorrow</span>':d>1?`<span class="cd">in ${d} days</span><small>&nbsp;</small>`:'<small>Add score</small>'}
function viewSchedule(){const S=sched(),rows=S.rows.filter(r=>String(r.date||'').startsWith(String(V.season)));
 let w=0,l=0,t=0;for(const r of rows)if(r.us!==''&&r.us!=null&&r.them!==''&&r.them!=null){+r.us>+r.them?w++:+r.us<+r.them?l++:t++}
 const fmt=d=>d?new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}):'No date';
 return`<div class="rec"><b>${w}–${l}${t?'–'+t:''}</b><span>${V.season} record</span><span style="flex:1"></span><button class="btn" id="impg">Import</button> <button class="btn pri" id="addg">+ Game</button></div>`+
 (rows.length?rows.map(r=>`<button class="row" data-row="${r.id}"><span data-edit="${r.id}" title="Edit game" style="display:flex;flex:none;cursor:pointer">${logoHtml(r)}</span><span class="mid"><div class="opp"><small>${r.ha==='A'?'at':'vs.'}</small>${esc(r.opp)}</div><div class="meta">${fmt(r.date)} · ${r.ha==='A'?'Away':r.ha==='N'?'Neutral':'Home'}${r.game||matchGame(r)?' · stats ready':''}</div></span><span class="res">${result(r)}</span></button>`).join('')
 :'<div class="empty">No games on the '+V.season+' schedule yet. Tap <b>+ Add game</b> to type them in.</div>')}
function matchGame(r){return r.game||((realGames(A()).find(g=>U(g.opp)===U(r.opp))||{}).id)}
function editRow(id){const S=sched(),r=id?S.rows.find(x=>x.id===id):{id:newId(),opp:'',date:'',ha:'H',us:'',them:'',color:'#3b4b5c',logo:null,game:null};
 const games=realGames(A());let ha=r.ha||'H',logo=r.logo||null;
 $('mbox').innerHTML=`<h3 style="margin-top:0;color:var(--tx);font-size:17px;text-transform:none;letter-spacing:0">${id?'Edit game':'Add game'}</h3>
 <div class="lab">Opponent</div><input type="text" id="eo" style="width:100%" value="${esc(r.opp)}">
 <div class="two"><div><div class="lab">Date</div><input type="date" id="ed" style="width:100%" value="${esc(r.date)}"></div><div><div class="lab">Site</div><div class="seg" id="eha">${[['H','Home'],['A','Away'],['N','Neutral']].map(([k,l])=>`<button data-ha="${k}" class="${ha===k?'on':''}">${l}</button>`).join('')}</div></div></div>
 <div class="two"><div><div class="lab">Our score</div><input type="number" inputmode="numeric" id="eu" style="width:100%" value="${esc(r.us)}"></div><div><div class="lab">Their score</div><input type="number" inputmode="numeric" id="et" style="width:100%" value="${esc(r.them)}"></div></div>
 <div class="lab">Logo</div><div style="display:flex;gap:10px;align-items:center"><span id="elp">${logoHtml(Object.assign({},r,{logo}))}</span><label class="btn">Upload PNG<input type="file" id="el" accept="image/*" style="display:none"></label><button class="btn" id="elx">Remove</button><input type="color" id="ec" value="${esc(r.color||'#3b4b5c')}" title="Badge color" style="width:44px;height:40px;padding:2px"></div>
 <div class="lab">Almanac game</div><select id="eg" style="width:100%"><option value="">${games.find(g=>U(g.opp)===U(r.opp))?'Match by name ('+esc(r.opp)+')':'None yet'}</option>${games.map(g=>`<option value="${g.id}" ${r.game===g.id?'selected':''}>${esc(g.opp)} · ${(g.plays||[]).filter(p=>p.k==='p').length} plays</option>`).join('')}</select>
 <p style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn pri" id="es">Save</button>${id?'<button class="btn bad" id="ex">Delete</button>':''}<button class="btn" id="ec2">Cancel</button></p>`;
 $('modal').classList.add('show');
 document.querySelectorAll('[data-ha]').forEach(b=>b.onclick=()=>{ha=b.dataset.ha;document.querySelectorAll('[data-ha]').forEach(x=>x.classList.toggle('on',x===b))});
 const prev=()=>{$('elp').innerHTML=logoHtml({opp:$('eo').value,color:$('ec').value,logo})};$('eo').oninput=prev;$('ec').oninput=prev;
 $('el').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=128,k=Math.min(z/im.width,z/im.height);c.width=c.height=z;const x=c.getContext('2d');
  x.drawImage(im,(z-im.width*k)/2,(z-im.height*k)/2,im.width*k,im.height*k);logo=c.toDataURL('image/png');prev();URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)};
 $('elx').onclick=()=>{logo=null;prev()};$('ec2').onclick=closeM;
 $('es').onclick=()=>{const opp=$('eo').value.trim();if(!opp){$('eo').focus();return}const S2=sched();const i=S2.rows.findIndex(x=>x.id===r.id);
  const row=Object.assign({},r,{opp,date:$('ed').value,ha,us:$('eu').value,them:$('et').value,color:$('ec').value,logo,game:$('eg').value||null,upd:Date.now()});
  if(i>=0)S2.rows[i]=row;else S2.rows.push(row);saveSched(S2);if(row.date)V.season=+row.date.slice(0,4);closeM();render()};
 const xb=$('ex');if(xb)xb.onclick=()=>{if(!confirm('Delete '+r.opp+' from the schedule?'))return;const S2=sched();S2.rows=S2.rows.filter(x=>x.id!==r.id);S2.deleted=[...(S2.deleted||[]),r.id];saveSched(S2);closeM();render()}}
function closeM(){$('modal').classList.remove('show')}
$('modal').onclick=e=>{if(e.target.id==='modal')closeM()};
/* ---------- season / game ---------- */
function gamesInSeason(){const a=A(),S=sched();return realGames(a).filter(g=>gameYear(g,S)===V.season)}
function viewSeason(gs,title){const L=A().lists||{},P=plays(gs),s=summ(P,L);
 if(!P.length)return`<div class="empty">No logged plays ${title?'for '+esc(title):'in '+V.season} yet.</div>`;
 let h=title?`<div class="rec"><b>${esc(title)}</b><span>${gs.length===1?'':''}</span><span style="flex:1"></span><button class="btn" id="back">‹ Back</button></div>`:'';
 h+=`<div class="tiles"><div class="t"><b>${title?s.n:gs.length}</b><span>${title?'Plays':'Games'}</span></div><div class="t"><b>${f1(s.ypp)}</b><span>Yds / play</span></div><div class="t"><b>${pct(s.eff)}</b><span>Efficient</span></div><div class="t"><b>${pct(s.exp)}</b><span>Explosive</span></div>
 <div class="t"><b>${title?s.yds:s.n}</b><span>${title?'Total yards':'Plays'}</span></div><div class="t"><b>${pct(s.run)}</b><span>Run</span></div><div class="t"><b>${s.td}</b><span>TDs</span></div><div class="t"><b>${s.to}</b><span>Turnovers</span></div></div>`;
 // passing
 const by=(arr,key)=>{const m={};for(const p of arr){const k=key(p);if(!k)continue;(m[k]=m[k]||[]).push(p)}return m};
 const pass=by(P.filter(p=>['COMP','INC','INT','SACK'].includes(p.result)),p=>p.passer||'?');
 h+='<h3>Passing</h3>'+tbl(['QB','Cmp/Att','Yds','TD','INT','Sacks','Yds/att'],Object.entries(pass).map(([q,a])=>{const at=a.filter(p=>p.result!=='SACK'),c=a.filter(p=>p.result==='COMP'),y=c.reduce((s,p)=>s+(+p.gain||0),0);
  return[PL(q),c.length+'/'+at.length,y,c.filter(p=>p.td).length,a.filter(p=>p.result==='INT').length,a.filter(p=>p.result==='SACK').length,at.length?f1(y/at.length):'–']}));
 const rush=by(P.filter(p=>p.result==='RUSH'||p.result==='SCRAM'),p=>p.player||p.passer||'?');
 h+='<h3>Rushing</h3>'+tbl(['Player','Car','Yds','Avg','TD','Long'],Object.entries(rush).sort((a,b)=>b[1].length-a[1].length).map(([k,a])=>{const y=a.reduce((s,p)=>s+(+p.gain||0),0);return[PL(k),a.length,y,f1(y/a.length),a.filter(p=>p.td).length,Math.max(...a.map(p=>+p.gain||0))]}));
 const rec=by(P.filter(p=>p.result==='COMP'),p=>p.player||'?');
 h+='<h3>Receiving</h3>'+tbl(['Player','Rec','Yds','Avg','TD','Long'],Object.entries(rec).sort((a,b)=>b[1].length-a[1].length).map(([k,a])=>{const y=a.reduce((s,p)=>s+(+p.gain||0),0);return[PL(k),a.length,y,f1(y/a.length),a.filter(p=>p.td).length,Math.max(...a.map(p=>+p.gain||0))]}));
 return h}
function tbl(head,rows,click){if(!rows.length)return'<p class="note">None yet.</p>';return`<table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr ${click?`class="click" data-g="${click[i]}"`:''}>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function viewGames(){const gs=gamesInSeason(),S=sched(),L=A().lists||{};if(!gs.length)return`<div class="empty">No logged games in ${V.season} yet.</div>`;
 const all=summ(plays(gs),L);
 const rows=gs.map(g=>{const s=summ(plays([g]),L),r=rowFor(g,S);return[`${r?logoHtml(r).replace('class="logo"','class="logo" style="width:28px;height:28px;font-size:11px;border-radius:7px;display:inline-grid;vertical-align:middle;margin-right:8px;'+(r.logo?'background:#fff':'background:'+(r.color||'#3b4b5c'))+'"'):''}${esc(g.opp)}`,r?result(r):'',s.n,delta(s.ypp,all.ypp,false,s.n),delta(s.eff,all.eff,true,s.n),delta(s.exp,all.exp,true,s.n),pct(s.run)]});
 return`<p class="note">Green / red = above / below the season average. Tap a game for its full stats.</p>`+tbl(['Game','Result','Plays','Yds/play','Eff','Exp','Run'],rows,gs.map(g=>g.id))}
/* ---------- splits ---------- */
function bucket(p){if(p.down===1)return'1st down';const n=+p.dist||10,b=n<=3?'short (1-3)':n<=6?'medium (4-6)':'long (7+)';return(p.down===2?'2nd ':p.down===3?'3rd ':'4th ')+b}
function zone(f){f=+f||25;return f<=20?'Backed up (own 1-20)':f<=40?'Own 20-40':f<=60?'Open field':f<=80?'Plus territory (opp 40-20)':f<=90?'Opp 20-10':'Red zone'}


/* ---------- import past games (.xlsx / .csv, Hudl column order) ---------- */
function importOpen(){const key=ALMK(),raw=localStorage.getItem(key);
 if(!raw){alert('Open the Almanac once first so this device has its game list, then come back to import.');return}
 $('mbox').innerHTML=`<h3 style="margin-top:0;color:var(--tx);font-size:17px;text-transform:none;letter-spacing:0">Import games</h3><p class="note" style="text-transform:none;letter-spacing:0">Pick an .xlsx or .csv in the Hudl column order (the Raw Data tab, or a file from the Almanac's Export). Several games in one sheet are split when play numbers restart or a game-name row sits between them. Only offensive plays are imported. Your Almanac lists and gameplan are not changed.</p>
 <input type="file" id="impfile" accept=".xlsx,.xlsm,.csv,text/csv" style="width:100%"><div id="impbox"></div><div class="two" style="margin-top:14px"><button class="btn" id="impx">Close</button></div>`;
 $('modal').classList.add('show');$('impx').onclick=closeM;
 $('impfile').onchange=async ev=>{const fl=ev.target.files[0],box=$('impbox');if(!fl)return;box.innerHTML='<p class="note">Reading…</p>';
  try{if(!window.Importer)throw new Error('The importer did not load. Check your connection and reopen the app.');const I=Importer;let rows;if(/\.csv$/i.test(fl.name)){rows=I.parseCsv(await fl.text());if(I.findHeader(rows)<0)throw new Error('Could not find a PLAY # column in that CSV')}else rows=(await I.readXlsx(await fl.arrayBuffer())).rows;
   const P=I.parseOwn(rows,fl.name);if(!P.blocks.length)throw new Error('No offensive plays found');
   const yr=new Date().getFullYear(),have=new Set(A().games.map(x=>x.src).filter(Boolean)),inp='style="padding:8px;font-size:15px;background:transparent;color:inherit;border:1px solid var(--line);border-radius:8px"';
   box.innerHTML=`<div class="lab" style="margin-top:10px">Season year (used when a game has no date)</div><input type="number" id="impyr" value="${yr}" ${inp} style="width:120px">
   <div class="lab" style="margin-top:12px">Games found (${P.blocks.length}${P.skipped?', '+P.skipped+' defensive/other rows skipped':''})</div>
   ${P.blocks.map((b,i)=>{const dup=have.has(fl.name+'|'+b.name);return`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-ib="${i}" ${dup?'':'checked'} style="width:20px;height:20px"><input type="text" data-in="${i}" value="${esc(b.name)}" ${inp} style="flex:1;min-width:0"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center"><input type="date" data-id="${i}" ${inp}><input type="number" data-iu="${i}" placeholder="Us" inputmode="numeric" ${inp} style="width:70px"><input type="number" data-it="${i}" placeholder="Them" inputmode="numeric" ${inp} style="width:70px"><span class="note" style="text-transform:none;letter-spacing:0">${b.n} plays${dup?' · already imported':''}</span></div></div>`}).join('')}
   <div style="margin-top:12px"><button class="btn pri" id="impgo">Import selected</button></div>`;
   $('impgo').onclick=()=>{const year=+$('impyr').value||yr;let a=null;try{a=JSON.parse(localStorage.getItem(key))}catch(e){}
    if(!a||!Array.isArray(a.games)){alert('Could not read this device’s game list. Open the Almanac once and try again.');return}
    let n=0,pl=0;const S=sched();let lastYear=null;
    P.blocks.forEach((b,i)=>{if(!box.querySelector(`[data-ib="${i}"]`).checked)return;const opp=box.querySelector(`[data-in="${i}"]`).value.trim()||b.name,dt=box.querySelector(`[data-id="${i}"]`).value,us=box.querySelector(`[data-iu="${i}"]`).value,th=box.querySelector(`[data-it="${i}"]`).value;
     const d0=dt?new Date(dt+'T12:00'):new Date(year,8,1+i*7,12);let ts=d0.getTime()+n,id='g'+ts;while(a.games.some(x=>x.id===id))id='g'+(++ts);
     a.games.push({id,opp,program:prog(),plays:b.plays.map(x=>Object.assign({},x)),src:fl.name+'|'+b.name,imported:true});n++;pl+=b.n;lastYear=d0.getFullYear();
     {const dd=dt||(d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0')+'-'+String(d0.getDate()).padStart(2,'0'));S.rows.push({id:newId(),opp,date:dd,ha:'H',us,them:th,color:'#3b4b5c',logo:null,game:id,upd:Date.now()})}});
    if(!n){alert('Nothing selected');return}
    try{localStorage.setItem(key,JSON.stringify(a))}catch(e){alert('Not enough room on this device to import that many games.');return}
    saveSched(S);if(lastYear)V.season=lastYear;closeM();render()}}
  catch(e){box.innerHTML='<p class="note" style="color:var(--bad);text-transform:none;letter-spacing:0">'+esc(e.message||String(e))+'</p>'}}}
/* ---------- custom split ---------- */
const CSK='stats_custom_v2';let CUS={lv:[{f:'call',v:[]},{f:'',v:[]}],sort:'n'};
try{const o=JSON.parse(localStorage.getItem(CSK));if(o&&Array.isArray(o.lv))CUS=Object.assign(CUS,o);else{const old=JSON.parse(localStorage.getItem('stats_custom_v1'));if(old)CUS.lv=[{f:old.g1||'call',v:[]},{f:old.g2||'',v:[]}]}}catch(e){}
function csSave(){try{localStorage.setItem(CSK,JSON.stringify(CUS))}catch(e){}}
const CSF=[['call','Call (concept / one word)'],['formation','Formation'],['ftag','Formation tag'],['motion','Motion / shift'],['tag','Play tag'],['target','Route / target'],['ptype','Run / pass'],['down','Down'],['bucket','Down & distance'],['zone','Field zone'],['hash','Hash'],['result','Result'],['player','Player (carrier / target)'],['passer','QB']];
const RESW={COMP:'Complete',INC:'Incomplete',RUSH:'Rush',SCRAM:'Scramble',SACK:'Sack',INT:'Interception',FUM:'Fumble lost'};
const listOf=(a,str)=>Array.isArray(a)&&a.length?a:(str?String(str).split(/\s+/).filter(Boolean):[]);
function csVals(p,k){const one=v=>v==null||v===''?[]:[String(v)],none=a=>a.length?a:['None'];
 switch(k){case'call':return one(p.owc||p.call);case'formation':return one(p.formation);case'ftag':return none(listOf(p.ftags,p.ftag));case'motion':return none(one(p.motion));case'tag':return none(listOf(p.tags,p.tag));
  case'target':return one(p.target);case'ptype':return[p.ptype==='run'?'Run':'Pass'];case'down':return p.down?[p.down+(['','st','nd','rd','th'][p.down]||'th')+' down']:[];case'bucket':return one(bucket(p));case'zone':return one(zone(p.f));
  case'hash':return p.hash?[({L:'Left hash',M:'Middle',R:'Right hash'})[p.hash]||p.hash]:[];case'result':return one(RESW[p.result]||p.result);case'player':return p.player?[PL(p.player).replace(/<[^>]*>/g,'')]:[];case'passer':return p.passer?[PL(p.passer).replace(/<[^>]*>/g,'')]:[]}
 return[]}
const csLab=k=>(CSF.find(x=>x[0]===k)||[k,k])[1];
function customSplit(P,L){
 const sel='style="padding:8px;font-size:15px;background:transparent;color:inherit;border:1px solid var(--line);border-radius:8px;max-width:100%"';
 const opts=cur=>'<option value="">Choose…</option>'+CSF.map(([k,l])=>`<option value="${k}" ${cur===k?'selected':''}>${esc(l)}</option>`).join('');
 const num=(a,b)=>a.localeCompare(b,undefined,{numeric:true});
 let Q=P;const info=CUS.lv.map(x=>{if(!x.f)return null;const cnt={};Q.forEach(p=>csVals(p,x.f).forEach(v=>cnt[v]=(cnt[v]||0)+1));const vals=Object.keys(cnt).sort(num),S=(x.v||[]).filter(v=>vals.includes(v));if(S.length)Q=Q.filter(p=>csVals(p,x.f).some(v=>S.includes(v)));return{vals,cnt,S}});
 const base=summ(Q,L),on=cmpOn('custom'),act=CUS.lv.map((x,i)=>info[i]?{f:x.f,S:info[i].S}:null).filter(Boolean);
 const m={};for(const p of Q){let keys=[''];for(const g of act){const v=csVals(p,g.f).filter(v=>!g.S.length||g.S.includes(v));if(!v.length){keys=[];break}if(g.S.length===1)continue;keys=keys.flatMap(a=>v.map(b=>a?a+' · '+b:b))}for(const k of keys)(m[k]=m[k]||[]).push(p)}
 const SK=CUS.sort||'n',ent=Object.entries(m).map(([k,a])=>[k||'Selected plays',a,summ(a,L)]).sort((a,b)=>{const ta=a[2].n<3,tb=b[2].n<3;if(SK!=='n'&&ta!==tb)return ta?1:-1;return(b[2][SK]||0)-(a[2][SK]||0)||b[2].n-a[2].n});
 const rows=ent.slice(0,80).map(([k,a,s])=>[esc(k),s.n,delta(s.ypp,base.ypp,false,s.n,on),delta(s.eff,base.eff,true,s.n,on),delta(s.exp,base.exp,true,s.n,on)]);
 const lv=CUS.lv.map((x,i)=>{const I=info[i];return`<div style="padding:10px 0;border-top:${i?'1px solid var(--line)':'0'}"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="note">${i?'Then by':'Sort by'}</span><select ${sel} data-csf="${i}">${opts(x.f)}</select>${CUS.lv.length>1?`<button class="btn" data-csx="${i}" style="padding:6px 10px;min-height:0;font-size:12px">Remove</button>`:''}</div>
  ${I?`<div class="chips"><button class="chip ${I.S.length?'':'on'}" data-csall="${i}">All</button>${I.vals.map(v=>`<button class="chip ${I.S.includes(v)?'on':''}" data-csv="${i}" data-val="${esc(v)}">${esc(v)} <i>${I.cnt[v]}</i></button>`).join('')}</div>`:''}</div>`}).join('');
 return`<div class="sh"><h3>Build your own split</h3><label class="cmp"><input type="checkbox" data-cmp="custom" ${on?'checked':''}>+/−</label></div>
 <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px 12px;margin-bottom:6px">${lv}
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px">${CUS.lv.length<5?'<button class="btn" id="csadd" style="padding:6px 10px;min-height:0;font-size:12px">+ Add another</button>':''}<span style="flex:1"></span><span class="note">Rank by</span><select ${sel} id="cssort"><option value="n" ${SK==='n'?'selected':''}>Most plays</option><option value="ypp" ${SK==='ypp'?'selected':''}>Yds / play</option><option value="eff" ${SK==='eff'?'selected':''}>Efficiency</option><option value="exp" ${SK==='exp'?'selected':''}>Explosive</option></select></div></div>`+(Q.length?`<p class="note">${Q.length} plays selected (${f1(base.ypp)} yds/play, ${pct(base.eff)} efficient, ${pct(base.exp)} explosive). +/− is against that selection. Tap values to pick some, or All. Rows under 3 plays rank last.</p>`+tbl(['','Plays','Yds/play','Eff','Exp'],rows):'<p class="note">No plays match.</p>')}
function viewSplits(){const gs=V.game?realGames(A()).filter(g=>g.id===V.game):gamesInSeason(),L=A().lists||{},P=plays(gs),all=summ(P,L);
 if(!P.length)return`<div class="empty">No logged plays in ${V.season} yet.</div>`;
 const split=(title,key,id)=>{const on=cmpOn(id);const m={};for(const p of P){const k=key(p);if(!k)continue;(m[k]=m[k]||[]).push(p)}
  const rows=Object.entries(m).sort((a,b)=>b[1].length-a[1].length).map(([k,a])=>{const s=summ(a,L);return[esc(k),s.n,delta(s.ypp,all.ypp,false,s.n,on),delta(s.eff,all.eff,true,s.n,on),delta(s.exp,all.exp,true,s.n,on)]});
  return`<div class="sh"><h3>${title}</h3><label class="cmp"><input type="checkbox" data-cmp="${id}" ${on?'checked':''}>+/−</label></div>`+tbl(['','Plays','Yds/play','Eff','Exp'],rows)};
 const IDS=['custom','call','form','down','zone','rp'],allOn=IDS.every(cmpOn);
 const L2=A().lists||{};return`<div style="display:flex;justify-content:flex-end"><label class="cmp" style="font-size:13px"><input type="checkbox" id="cmpall" ${allOn?'checked':''}>Show all +/−</label></div><p class="note">Explosive = ${(L2.expRun||15)===(L2.expPass||15)?(L2.expRun||15)+'+ yards on any play':(L2.expRun||15)+'+ run, '+(L2.expPass||15)+'+ pass'} (change in Almanac › Setup). Compared with the ${V.season} average (${f1(all.ypp)} yds/play, ${pct(all.eff)} efficient, ${pct(all.exp)} explosive). Fewer than 3 plays shows no +/–.</p>${customSplit(P,L)}`+
  split('By call (one word or concept)',p=>p.owc||p.call,'call')+split('By formation',p=>p.formation?(p.formation+(p.ftag?' '+p.ftag:'')):null,'form')+split('By down and distance',bucket,'down')+split('By field zone',p=>zone(p.f),'zone')+split('Run / pass',p=>p.ptype==='run'?'Run':'Pass','rp')}
/* ---------- render ---------- */
function render(){hdr();let h;
 if(V.game){const g=realGames(A()).find(x=>x.id===V.game);h=g?viewSeason([g],g.opp):'<div class="empty">Game not found.</div>'}
 else if(V.tab==='schedule')h=viewSchedule();else if(V.tab==='season')h=viewSeason(gamesInSeason());else if(V.tab==='games')h=viewGames();else h=viewSplits();
 $('main').innerHTML=h;
 document.querySelectorAll('[data-cmp]').forEach(c=>c.onchange=()=>{if(c.checked)delete CMP[c.dataset.cmp];else CMP[c.dataset.cmp]=1;cmpSave();render()});
 const ca=$('cmpall');if(ca)ca.onchange=()=>{['custom','call','form','down','zone','rp'].forEach(k=>{if(ca.checked)delete CMP[k];else CMP[k]=1});cmpSave();render()};
 if($('cssort')){$('cssort').onchange=e=>{CUS.sort=e.target.value;csSave();render()};const ad=$('csadd');if(ad)ad.onclick=()=>{CUS.lv.push({f:'',v:[]});csSave();render()};
  document.querySelectorAll('[data-csf]').forEach(x=>x.onchange=()=>{CUS.lv[+x.dataset.csf]={f:x.value,v:[]};csSave();render()});
  document.querySelectorAll('[data-csall]').forEach(x=>x.onclick=()=>{CUS.lv[+x.dataset.csall].v=[];csSave();render()});
  document.querySelectorAll('[data-csv]').forEach(x=>x.onclick=()=>{const L=CUS.lv[+x.dataset.csv],v=x.dataset.val,i=(L.v||[]).indexOf(v);L.v=L.v||[];if(i<0)L.v.push(v);else L.v.splice(i,1);csSave();render()});
  document.querySelectorAll('[data-csx]').forEach(x=>x.onclick=()=>{CUS.lv.splice(+x.dataset.csx,1);csSave();render()})}
 const ig=$('impg');if(ig)ig.onclick=importOpen;
 const ag=$('addg');if(ag)ag.onclick=()=>editRow(null);
 document.querySelectorAll('[data-row]').forEach(b=>b.onclick=e=>{const r=sched().rows.find(x=>x.id===b.dataset.row),gid=r&&matchGame(r);if(e.target.closest('[data-edit]')||!gid)return editRow(b.dataset.row);V.game=gid;render()});
 document.querySelectorAll('tr[data-g]').forEach(r=>r.onclick=()=>{V.game=r.dataset.g;render()});
 const bk=$('back');if(bk)bk.onclick=()=>{V.game=null;render()}}
addEventListener('storage',e=>{if(e.key==='almanac_v1'||e.key==='almanac_demo'||(e.key&&e.key.indexOf('schedule_v1_')===0))render()});
addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.schedule)render()});
try{window.DemoSeed&&DemoSeed.ensure()}catch(e){}
render();
</script></body></html>
