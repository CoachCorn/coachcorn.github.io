<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KDNCE">
<title>KDNCE</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0f1720;--card:#18232f;--line:#2a3948;--tx:#e8eef4;--mut:#8ea0b2;--acc:#3b9cff;--ok:#2fbf71;--warn:#f2b632;--bad:#ef5b5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px -apple-system,system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
button,input{font:inherit;color:var(--tx)}
/* home */
#home{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.hero{position:relative;padding:max(34px,calc(env(safe-area-inset-top) + 22px)) 22px 70px;text-align:center;background:url(turf.jpg) center/cover;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,10,.35) 0%,rgba(8,14,10,.55) 55%,var(--bg) 100%)}
.hero>*{position:relative;z-index:1}
.hero .k{width:84px;height:84px;border-radius:20px;box-shadow:0 10px 28px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.hero .brand{font-size:40px;font-weight:900;letter-spacing:.22em;padding-left:.22em;margin:14px 0 4px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.hero .prog{display:inline-block;margin-top:6px;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14);font-weight:700;font-size:14px;letter-spacing:.04em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hero .prog:empty{display:none}
.hero .date{color:#cfe3d2;font-size:13px;margin-top:10px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.wrap{width:min(760px,100%);margin:-40px auto 0;padding:0 16px 30px;position:relative;z-index:2}
.week{margin-bottom:14px}
.gcard{background:linear-gradient(135deg,#17324f,#152230 65%);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.gcard .lab2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:8px}
.gtop{display:flex;align-items:center;gap:12px}.gtop .lg{flex:none;width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font-weight:900;color:#fff;overflow:hidden}.gtop .lg img{width:100%;height:100%;object-fit:contain;background:#fff}
.gtop .op{font-size:19px;font-weight:800}.gtop .op small{color:var(--mut);font-weight:600;font-size:14px;margin-right:4px}.gtop .wh{color:var(--mut);font-size:13px;margin-top:2px}.gtop .cd{margin-left:auto;color:var(--warn);font-weight:800;white-space:nowrap}
.gstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.gs{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.gs .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}.gs .v{font-size:20px;font-weight:800;margin-top:2px}.gs .s{font-size:12px;color:var(--mut);margin-top:1px}
.gloss{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--mut)}.gloss .gd{width:9px;height:9px;border-radius:50%;background:var(--ok)}.gloss .gd.w{background:var(--warn)}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--mut)}
.pill b{color:var(--tx)}
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
.tile{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(180deg,#1b2835,#151f2a);border:1px solid var(--line);border-radius:16px;padding:14px 16px;height:84px;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .08s}
.tile:active{transform:scale(.98)}

.tile .ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center}
.tile .ic svg{width:28px;height:28px}
.tile .tx{flex:1;min-width:0}
.tile b{display:block;font-size:19px;letter-spacing:.05em;text-transform:uppercase}
.tile span.d{display:block;color:var(--mut);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .go{flex:none;color:var(--mut);font-size:22px}
.tile .dot{position:absolute;top:10px;right:12px;background:var(--warn);color:#2a1e00;font-size:11px;font-weight:800;border-radius:9px;padding:2px 8px}
.tile.soon{opacity:.6}.tile.soon .go{display:none}
.tile .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
#syncline{margin:22px auto 0;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mut);font-size:13px;flex-wrap:wrap}
#syncline .sd{width:9px;height:9px;border-radius:50%;background:var(--mut)}
#syncline .sd.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}#syncline .sd.bad{background:var(--bad)}#syncline .sd.busy{background:var(--warn)}
#syncline button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;text-transform:uppercase;font-size:12px;font-weight:700}
/* tool view */
#bar{display:none;align-items:center;gap:8px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:#070c12;border-bottom:1px solid var(--line);flex:none}
#bar .home{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 12px;min-height:36px;font-weight:700;text-transform:uppercase;font-size:13px}
#bar .ttl{font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:13px}
#bar .sp{flex:1}#bar .st{font-size:11px;color:var(--mut)}
#views{flex:1;position:relative;min-height:0;display:none}
#views iframe,#views .soonv{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#views .on{display:block}
.soonv{padding:30px;color:var(--mut)}.soonv h2{color:var(--tx);margin-top:0}
body.tool #home{display:none}body.tool #bar{display:flex}body.tool #views{display:block}
/* modal */
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
.modal.show{display:flex}.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(460px,94vw);max-height:90vh;overflow:auto}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:10px 0 4px}
.box input{width:100%;background:#102030;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:16px}
.btn{background:#223140;border:1px solid var(--line);border-radius:8px;padding:9px 14px;min-height:40px;text-transform:uppercase;font-weight:700}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.err{color:var(--bad);font-size:13px;margin-top:8px}.note{color:var(--mut);font-size:12px}
details{margin-top:14px}summary{color:var(--mut);font-size:13px}
</style></head><body>
<div id="home">
 <div class="hero"><img class="k" src="icon-192.png" alt=""><div class="brand">KDNCE</div><div><span class="prog" id="pname"></span></div><div class="date" id="psub"></div></div>
 <div class="wrap"><div class="week" id="week"></div><div class="tiles" id="tiles"></div><div id="syncline"></div></div>
</div>
<div id="bar"><button class="home" id="homebtn">‹ Home</button><span class="ttl" id="ttl"></span><span class="sp"></span><span class="st" id="st"></span></div>
<div id="views"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<script src="../shared/glossary.js"></script>
<script src="sync.js"></script>
<script>
/* One installed app for the staff tools. Every tool runs in its own frame from the same site, so they all share
   one storage area on the device (one glossary, one set of games). Frames stay loaded after you leave them. */
const PROGRAM='deer-creek';
const DEFAULT_SERVER='https://kdnce.coachnoahcornell.workers.dev';
const IC={
 almanac:['#3b9cff','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3"/><path d="M8.5 10h7M8.5 14h7M8.5 18h4"/></svg>'],
 film:['#2fbf71','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>'],
 gameplan:['#9b7bff','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>'],
 stats:['#ef5b5b','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'],
 glossary:['#f2b632','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6M9 11h4"/></svg>']};
const TOOLS=[
 {id:'almanac',name:'Almanac',desc:'Sideline log, stats, predicted call',src:'../almanac/'},
 {id:'film',name:'Film Room',desc:'Game reports and tagging',src:'../film-room/'},
 {id:'gameplan',name:'Gameplan',desc:'Weekly grid and best calls',soon:'The gameplan grid is still a mockup. When it is built it opens here and sends its gameplan and best calls to the Almanac.'},
 {id:'glossary',name:'Glossary',desc:'Every term every tool uses',src:'glossary.html'},
 {id:'stats',name:'Stats',desc:'Schedule, season and game stats',src:'stats.html'}
];
const $=id=>document.getElementById(id),made={};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function frame(t){if(made[t.id])return made[t.id];let el;
 if(t.soon){el=document.createElement('div');el.className='soonv';el.innerHTML='<h2>'+t.name+'</h2><p>'+t.soon+'</p>'}
 else{el=document.createElement('iframe');el.src=t.src;el.title=t.name;el.setAttribute('allow','clipboard-write')}
 $('views').appendChild(el);return made[t.id]=el}
function open(id){const t=TOOLS.find(x=>x.id===id);if(!t)return goHome();
 for(const k in made)made[k].classList.toggle('on',k===t.id);frame(t).classList.add('on');
 $('ttl').textContent=t.name;document.body.classList.add('tool');try{localStorage.setItem('suite_tab',t.id)}catch(e){}}
function goHome(){document.body.classList.remove('tool');try{localStorage.setItem('suite_tab','')}catch(e){}renderHome()}
function reviewCount(){if(!window.GL)return 0;const g=GL.load(PROGRAM);return g?GL.reviewList(g).length:0}
function curGame(){try{const A=JSON.parse(localStorage.getItem('almanac_v1'));const g=A&&A.games.find(x=>x.id===A.cur);if(!g)return'';const n=g.plays.filter(p=>p.k==='p').length;return esc(g.opp)+' · '+n+' play'+(n===1?'':'s')+(g.scout?' · scout loaded':'')}catch(e){return''}}
function almInfo(){try{const A=JSON.parse(localStorage.getItem('almanac_v1'));const g=A&&A.games.find(x=>x.id===A.cur);if(!g)return null;return{opp:g.opp,n:g.plays.filter(p=>p.k==='p').length,scout:g.scout&&g.scout.name,demo:g.demo}}catch(e){return null}}
function seasonO(){try{const A=JSON.parse(localStorage.getItem('almanac_v1'));const y=new Date().getFullYear(),L=A.lists||{};
 const P=A.games.filter(g=>!g.demo&&!/\(other iPad\)$/.test(g.opp||'')&&(parseInt(String(g.id).slice(1),10)>1e12?new Date(parseInt(String(g.id).slice(1),10)).getFullYear():y)===y).flatMap(g=>g.plays.filter(p=>p.k==='p'&&p.result!=='PEN'));
 if(!P.length)return null;const ef=p=>{if(p.td)return 1;const g=+p.gain||0,n=+p.dist||10;return p.down===1?g>=(n>=10?4:n):p.down===2?g>=Math.ceil(n/2):g>=n};
 return{eff:Math.round(100*P.filter(ef).length/P.length),ypp:(P.reduce((a,p)=>a+(+p.gain||0),0)/P.length).toFixed(1),n:P.length}}catch(e){return null}}
function theirD(opp){try{const A=JSON.parse(localStorage.getItem('almanac_v1'));const U=x=>String(x||'').trim().toUpperCase();
 const g=A.games.find(g=>g.scout&&(U(g.opp)===U(opp)||U(g.scout.name).includes(U(opp))));if(!g)return null;const R=g.scout.rows.filter(r=>r.cv);if(!R.length)return null;
 const m={};R.forEach(r=>m[r.cv]=(m[r.cv]||0)+1);const top=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];const rr=g.scout.rows.filter(r=>r.rs!=='');
 const pr=rr.length?Math.round(100*rr.filter(r=>+r.rs>=4).length/rr.length):null;return{cov:top[0],covP:Math.round(100*top[1]/R.length),pr,n:g.scout.rows.length}}catch(e){return null}}
function nextGame(){try{const p=(JSON.parse(localStorage.getItem('suite_sync'))||{}).program||'deer-creek';const S=JSON.parse(localStorage.getItem('schedule_v1_'+p));if(!S)return null;
 const today=new Date(new Date().toDateString()+' 12:00');const r=S.rows.find(r=>r.date&&new Date(r.date+'T12:00')>=today&&!(r.us!==''&&r.us!=null));if(!r)return null;
 const d=Math.round((new Date(r.date+'T12:00')-today)/864e5);return{opp:r.opp,ha:r.ha,date:r.date,logo:r.logo,color:r.color,when:d===0?'Today':d===1?'Tomorrow':'in '+d+' days'}}catch(e){return null}}
function renderHome(){const s=SUITESYNC.status(),n=reviewCount(),ai=almInfo(),ng=nextGame();
 $('pname').textContent=s.signedIn&&s.name?s.name+' Football':'';
 $('psub').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
 const o=seasonO(),dd=ng?theirD(ng.opp):null,ini=n2=>String(n2).split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase();
 const card=`<div class="gcard"><div class="lab2">Upcoming game</div>${ng?`<div class="gtop"><span class="lg" style="background:${ng.logo?'#fff':(ng.color||'#3b4b5c')}">${ng.logo?`<img src="${ng.logo}" alt="">`:esc(ini(ng.opp))}</span><div><div class="op"><small>${ng.ha==='A'?'at':'vs.'}</small>${esc(ng.opp)}</div><div class="wh">${new Date(ng.date+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${ng.ha==='A'?'Away':ng.ha==='N'?'Neutral':'Home'}</div></div><span class="cd">${ng.when}</span></div>`
  :`<div class="gtop"><div class="wh">No upcoming game. Add your schedule in <b>Stats</b>.</div></div>`}
 <div class="gstats"><div class="gs"><div class="k">Our offense</div>${o?`<div class="v">${o.eff}% efficient</div><div class="s">${o.ypp} yds/play · ${o.n} plays this season</div>`:`<div class="v">–</div><div class="s">No plays logged this season</div>`}</div>
 <div class="gs"><div class="k">Their defense</div>${dd?`<div class="v">${esc(dd.cov)} ${dd.covP}%</div><div class="s">${dd.pr!=null?dd.pr+'% bring 4+ · ':''}${dd.n} scout plays</div>`:`<div class="v">–</div><div class="s">${ng?'Load their scout in the Almanac':'Needs an upcoming game'}</div>`}</div></div>
 <div class="gloss"><span class="gd ${n?'w':''}"></span>${n?`Glossary: <b style="color:var(--warn)">${n} term${n===1?'':'s'} to review</b>`:'Glossary up to date'}</div></div>`;
 $('week').innerHTML=card;
 const desc=t=>t.id==='almanac'&&ai&&!ai.demo?`${esc(ai.opp)} · ${ai.n} play${ai.n===1?'':'s'}${ai.scout?' · scout loaded':''}`:t.desc;
 $('tiles').innerHTML=TOOLS.map(t=>{const[c,svg]=IC[t.id];return`<button class="tile ${t.soon?'soon':''}" data-t="${t.id}"><span class="ic" style="background:${c}22;color:${c}">${svg}</span><span class="tx"><b>${t.name}${t.soon?'<span class="tag">SOON</span>':''}</b><span class="d">${desc(t)}</span></span><span class="go">›</span>${t.id==='glossary'&&n?`<span class="dot">${n}</span>`:''}</button>`}).join('');
 const ago=s.last?Math.round((Date.now()-s.last)/60000):null,cls=!s.signedIn?'':s.busy?'busy':s.error?'bad':'ok';
 const txt=s.signedIn?(s.busy?'Syncing…':s.error?esc(s.error):'Synced '+(ago===0?'just now':ago+' min ago'))+(navigator.onLine?'':' · offline'):'This iPad only · not syncing';
 $('syncline').innerHTML=`<span class="sd ${cls}"></span><span>${txt}</span><button id="syncbtn">${s.signedIn?'Sync':'Sign in'}</button>`;
 $('syncbtn').onclick=signInModal}
function barStatus(){const s=SUITESYNC.status();$('st').textContent=!navigator.onLine?'Offline':s.busy?'Syncing…':s.error?'Sync problem':s.signedIn?'Synced':''}
$('tiles').onclick=e=>{const b=e.target.closest('[data-t]');if(b)open(b.dataset.t)};
$('homebtn').onclick=goHome;
/* A tool can ask the shell to open another tool, e.g. the Almanac's Glossary button. */
addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||!e.data.open)return;open(e.data.open);
 if(e.data.open==='glossary'&&made.glossary&&made.glossary.contentWindow)made.glossary.contentWindow.postMessage({glossary:'review'},location.origin)});
addEventListener('storage',e=>{if(e.key&&(e.key.indexOf('glossary_v1_')===0||e.key.indexOf('schedule_v1_')===0)&&!document.body.classList.contains('tool'))renderHome()});
addEventListener('online',()=>{renderHome();barStatus()});addEventListener('offline',()=>{renderHome();barStatus()});
/* sign in */
function modal(h){$('mbox').innerHTML=h;$('modal').classList.add('show')}
function closeM(){$('modal').classList.remove('show')}
$('modal').onclick=e=>{if(e.target.id==='modal')closeM()};
/* Password boxes get a Show / Hide button. */
function pwToggle(id){const i=$(id);if(!i||i.dataset.pw)return;i.dataset.pw=1;const w=document.createElement('div');w.style.cssText='display:flex;gap:6px;align-items:center';
 i.parentNode.insertBefore(w,i);w.appendChild(i);const b=document.createElement('button');b.type='button';b.className='btn';b.textContent='Show';b.style.minWidth='72px';
 b.onclick=()=>{const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'Hide':'Show';i.focus()};w.appendChild(b)}
function signInModal(){const s=SUITESYNC.status();
 if(s.signedIn){modal(`<h3 style="margin-top:0">Sync · ${esc(s.name||s.program)}</h3><p class="note">Server ${esc(s.url)}</p>
  <p style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" id="sn">Sync now</button><button class="btn" id="so">Sign out this iPad</button><button class="btn" id="sx">Close</button></p>`);
  $('sn').onclick=()=>{SUITESYNC.syncNow();closeM()};$('so').onclick=()=>{SUITESYNC.signOut();closeM();renderHome()};$('sx').onclick=closeM;return}
 modal(`<h3 style="margin-top:0">Sign in to sync</h3><p class="note">Signing in keeps this iPad's glossary and games in step with the rest of the staff. Everything still works offline.</p>
 <div class="lab">Server address</div><input id="su" value="${esc(s.url||DEFAULT_SERVER)}" placeholder="https://coach-suite.….workers.dev" autocapitalize="off" autocorrect="off">
 <div class="lab">Program</div><input id="sp" value="${esc(s.program||PROGRAM)}" autocapitalize="off">
 <div class="lab">Staff passcode</div><input id="sc" type="password" autocapitalize="off" autocorrect="off" spellcheck="false">
 <div id="se" class="err"></div>
 <p style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn pri" id="sg">Sign in</button><button class="btn" id="sx">Cancel</button></p>
 <details><summary>First-time setup (creates the program or changes its passcode)</summary>
  <div class="lab">Admin key</div><input id="sa" type="password" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div class="lab">Program name</div><input id="sn2" value="Deer Creek">
  <p class="note">Uses the program and passcode above. The passcode needs 8+ characters. Changing it signs every iPad out.</p>
  <button class="btn" id="ss">Create / set passcode</button></details>`);
 pwToggle('sc');pwToggle('sa');
 $('sx').onclick=closeM;
 $('sg').onclick=async()=>{$('se').textContent='';try{await SUITESYNC.login($('su').value,$('sp').value,$('sc').value);closeM();renderHome();SUITESYNC.syncNow()}catch(e){$('se').textContent=e.message}};
 $('ss').onclick=async()=>{$('se').textContent='';try{await SUITESYNC.setup($('su').value,$('sp').value.trim().toLowerCase(),$('sn2').value,$('sc').value,$('sa').value);$('se').style.color='var(--ok)';$('se').textContent='Program set. Now tap Sign in.'}catch(e){$('se').style.color='';$('se').textContent=e.message}}}
SUITESYNC.onChange(()=>{renderHome();barStatus()});
frame(TOOLS[0]); // load the Almanac in the background so it is ready (and so sync can reach it)
let start='';try{start=localStorage.getItem('suite_tab')||''}catch(e){}
start?open(start):renderHome();renderHome();barStatus();setInterval(()=>{if(!document.body.classList.contains('tool'))renderHome()},30000);
SUITESYNC.start();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
