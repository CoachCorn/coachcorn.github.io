<title>Playbook Flashcards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Phone-first play sheet: one screen at a time, big tap targets, Next bar pinned to the bottom. */
:root{
  --paper:#f2f3ef; --card:#ffffff; --ink:#15191f; --ink2:#4a525d; --line:#c9cdc4;
  --turf:#1d6b43; --turf-bg:#dcebe1; --miss:#b4491a; --miss-bg:#f5e0d4; --amber:#8a6410; --amber-bg:#f3e7c6;
  --font-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12151a; --card:#1b2028; --ink:#eceee9; --ink2:#a3abb5; --line:#343b46;
  --turf:#5fbf87; --turf-bg:#173a29; --miss:#f0905e; --miss-bg:#3d2417; --amber:#e3bd5a; --amber-bg:#3a2f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12151a; --card:#1b2028; --ink:#eceee9; --ink2:#a3abb5; --line:#343b46;
  --turf:#5fbf87; --turf-bg:#173a29; --miss:#f0905e; --miss-bg:#3d2417; --amber:#e3bd5a; --amber-bg:#3a2f12; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:400 17px/1.45 var(--font-body);-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
#app{max-width:560px;margin:0 auto;padding-top:14px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);padding:13px 14px;width:100%;min-width:0;border-radius:0;-webkit-appearance:none;appearance:none}
input{font-size:17px}
:focus-visible{outline:3px solid var(--turf);outline-offset:2px}
h1,h2{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.02}
h1{font-size:40px;font-weight:700} h2{font-size:28px;font-weight:700}
.lbl{font:600 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.muted{color:var(--ink2)} .small{font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.link{background:none;border:0;padding:10px 0;color:var(--ink2);text-decoration:underline;font-size:15px}
.chip{font:600 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;border:1.5px solid currentColor;padding:4px 7px;display:inline-block}
.panel{background:var(--card);border:2px solid var(--ink);padding:16px;margin-bottom:14px}
.btn{display:block;width:100%;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:16px 18px;min-height:56px;font:700 20px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;text-align:center}
.btn.alt{background:transparent;color:var(--ink)}
.stack{display:grid;gap:10px}
.pickbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:16px;min-height:56px;border:2px solid var(--line);background:var(--card);font-weight:500;width:100%}
.pickbtn:active{border-color:var(--ink)}
.meter{height:12px;background:var(--paper);border:2px solid var(--ink);position:relative}
.meter>i{position:absolute;inset:0 auto 0 0;background:var(--turf);display:block}
.nums{font:500 15px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.deck{display:grid;gap:10px;text-align:left;width:100%;padding:16px;border:2px solid var(--ink);background:var(--card)}
.deck .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.diagram{background:#fff;border:2px solid var(--ink);line-height:0}
.diagram img{width:100%;height:auto;display:block}
.diagram.sig img{max-width:240px;margin:0 auto;padding:10px}
.cap{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;border:2px solid var(--ink);border-top:0;background:var(--card);font-size:14px;line-height:1.2}
.q{font:700 30px/1.08 var(--font-display);margin:10px 0 14px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:15px 14px;min-height:58px;border:2px solid var(--line);background:var(--card);font-weight:500;display:flex;gap:12px;align-items:baseline;width:100%}
.opt b{font:600 13px/1 var(--font-mono);color:var(--ink2)}
.opt.right{border-color:var(--turf);background:var(--turf-bg)}
.opt.wrong{border-color:var(--miss);background:var(--miss-bg)}
.back{margin-top:14px;border-left:6px solid var(--ink);padding:10px 14px;background:var(--card)}
.back.ok{border-color:var(--turf)} .back.no{border-color:var(--miss)}
.pips{display:flex;gap:6px}
.pip{width:16px;height:16px;border:2px solid var(--ink)}
.pip.on{background:var(--turf);border-color:var(--turf)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--paper);border-top:2px solid var(--ink)}
.dock .btn{max-width:560px;margin:0 auto}
.notice{margin:0 0 14px;padding:10px 14px;border:2px solid var(--amber);background:var(--amber-bg)}
.empty{padding:22px 16px;border:2px dashed var(--line);text-align:center;color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{border:2px solid var(--ink);background:var(--card);padding:10px 12px}
.tile .n{font:700 36px/1 var(--font-display);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:430px;font-size:15px}
th{font:600 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:8px;border-bottom:2px solid var(--ink)}
td{padding:10px 8px;border-bottom:1px solid var(--line)}
td.num{font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums}
.st{font:600 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;display:inline-block}
.st.none{background:var(--miss-bg);color:var(--miss)} .st.mid{background:var(--amber-bg);color:var(--amber)} .st.done{background:var(--turf-bg);color:var(--turf)}
.hard{display:grid;gap:12px}
.hard .item{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;align-items:baseline}
.hard .pct{font:700 28px/1 var(--font-display);color:var(--miss)}
</style>
</head>

<script>
(function(){
"use strict";
/* ===== Settings ===== */
var ENDPOINT="https://script.google.com/macros/s/AKfycbzPLWz-5pg_83eaY8OYmwd6--Ub3v-b6wPDWsbKUgvDduiLxd24L7lBqgCO7X1N9Awydw/exec";   /* paste the Google Apps Script web app URL here; leave empty to run on this phone only */
var MASTER={streak:3,days:2};

var POSLIST=["Q","T","X","H","M","Z"];
var PLABEL={Q:"Q (QB)",T:"T (Tailback)",X:"X",H:"H (F)",M:"M (Y)",Z:"Z"};

function deckOf(c){
  var id=c.id;
  if(id.indexOf("fm-")===0)return "form";
  if(id.indexOf("ow-m-")===0)return "ow";
  if(id.indexOf("ow-")===0||id.indexOf("tg-")===0)return "st";

}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function normDay(d,t){var s=String(d==null?"":d),m=s.match(/^(\d{4}-\d{2}-\d{2})/);if(m)return m[1];var ms=Date.parse(s);if(isNaN(ms))ms=+t;if(!ms)return "";var x=new Date(ms);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function daysAgo(s){if(!s)return "Never";var a=new Date(s+"T00:00:00"),b=new Date(today()+"T00:00:00");var n=Math.round((b-a)/864e5);return n<=0?"Today":n===1?"Yesterday":n+" days ago"}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function jget(k,d){try{var v=JSON.parse(lsGet(k));return v==null?d:v}catch(e){return d}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function cardsFor(pos,deck){return CARDS.filter(function(c){return c.pos.indexOf(pos)>-1&&(!deck||c.deck===deck)})}
function derive(evs){
  var m={};
  evs.slice().sort(function(a,b){return a.t-b.t}).forEach(function(e){
    var x=m[e.c]||(m[e.c]={s:0,d:[],r:0,w:0,m:false});
    if(e.ok){x.r++;x.s++;if(x.d.indexOf(e.d)<0)x.d.push(e.d);if(x.s>=MASTER.streak&&x.d.length>=MASTER.days)x.m=true}
    else{x.w++;x.s=0;x.d=[]}
  });
  return m;
}
function st(m,id){return m[id]||{s:0,d:[],r:0,w:0,m:false}}
function mastered(m,pos,deck){var n=0;cardsFor(pos,deck).forEach(function(c){if(st(m,c.id).m)n++});return n}

function getJSON(params){
  var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k])}).join("&");
  if(window.google&&google.script&&google.script.run)return new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(rej).apiGet(params)});
  return fetch(ENDPOINT+(ENDPOINT.indexOf("?")>-1?"&":"?")+qs).then(function(r){return r.json()});
}
function postJSON(obj){
  if(window.google&&google.script&&google.script.run)return new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(rej).apiPost(JSON.stringify(obj))});
  return fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)}).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.text()});
}
function flush(){
  if(!ENDPOINT||flushing||!queue.length)return;
  flushing=true;
  (function next(){
    if(!queue.length){flushing=false;return}
    postJSON(queue[0]).then(function(){queue.shift();lsSet("pbf2.queue",JSON.stringify(queue));next()}).catch(function(){flushing=false});
  })();
}

  pos=np(pos);me={name:name.trim(),pos:pos};lsSet("pbf2.me",JSON.stringify(me));
  events=jget(evKey(),[]);
  view="home";cur=null;render();
  if(ENDPOINT){

      if(!Array.isArray(rows))return;
      var have={};events.forEach(function(e){have[e.id]=1});
      rows.forEach(function(r){if(!have[r.eid]){events.push({id:r.eid,t:+r.t||Date.parse(r.ts)||0,c:r.card,ok:+r.ok,d:r.day});have[r.eid]=1}});
      saveEvents();
      if(view==="home")render();
    }).catch(function(){});
  }

}
function answer(i){
  if(cur.picked!==null)return;
  cur.picked=i;
  var ok=cur.order[i]===cur.card.a?1:0, t=Date.now();
  var ev={id:t+"-"+Math.random().toString(36).slice(2,7),t:t,c:cur.card.id,ok:ok,d:today()};
  events.push(ev);saveEvents();
  if(ENDPOINT){queue.push({type:"answer",eid:ev.id,t:t,name:me.name,pos:me.pos,card:ev.c,ok:ok,day:ev.d});lsSet("pbf2.queue",JSON.stringify(queue));flush()}
  render();
}

  if(a==="pick"){signIn(b.getAttribute("data-n"),b.getAttribute("data-p"))}
  else if(a==="newme"){
    var nm=document.getElementById("nm").value; if(nm.trim().length<2){document.getElementById("nm").focus();return}
    var ps=document.getElementById("ps").value;
    if(ENDPOINT){queue.push({type:"player",name:nm.trim(),pos:ps});lsSet("pbf2.queue",JSON.stringify(queue))}
    signIn(nm,ps);
  }
  else if(a==="deck"){deck=b.getAttribute("data-id");cur=null;view="quiz";render();window.scrollTo(0,0)}
  else if(a==="home"){view="home";cur=null;render();window.scrollTo(0,0)}
  else if(a==="opt"){answer(+b.getAttribute("data-i"))}
  else if(a==="next"){nextCard();render();window.scrollTo(0,0)}
  else if(a==="logout"){me=null;lsSet("pbf2.me","");events=[];cur=null;coachData=null;view="login";render();loadRoster()}
  else if(a==="coach"){view="coach";render()}
  else if(a==="coachgo"){
    var c=document.getElementById("code"); var code=c?c.value:lsGet("pbf2.code")||"";
    coachMsg="";
    getJSON({action:"all",code:code}).then(function(d){
      if(d&&d.error){coachMsg="That code did not work.";coachData=null}
      else{d.roster=d.roster.map(function(x){return {name:x.name,pos:np(x.pos)}});d.log=d.log.map(function(x){x.pos=np(x.pos);return x});coachData=d;lsSet("pbf2.code",code)}
      render();
    }).catch(function(){coachMsg="Could not reach the Sheet.";render()});
  }
});
document.addEventListener("input",function(e){
  if(e.target&&e.target.id==="flt"){filter=e.target.value;var l=document.getElementById("rlist");if(l)l.innerHTML=rosterList()}
});
function loadRoster(){
  if(!ENDPOINT)return;
  roster=null;rosterErr=false;
  getJSON({action:"roster"}).then(function(r){roster=Array.isArray(r)?r.map(function(x){return {name:x.name,pos:np(x.pos)}}):[];if(view==="login")render()}).catch(function(err){rosterErr=String((err&&(err.message||err))||"unknown");roster=[];if(view==="login")render()});
}

/* ===== Boot ===== */
if(location.hash==="#coach")view="coach";
else if(me&&me.name){events=jget(evKey(),[]);view="home"}
render();
if(view==="login")loadRoster();
if(view==="home"&&ENDPOINT){signIn(me.name,me.pos)}
flush();
})();
</script>
</body>
</html>
