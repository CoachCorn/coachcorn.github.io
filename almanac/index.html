<style>

.chip,.btn,.lab,.card h3{text-transform:uppercase}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:40px}

.btn.bad{color:var(--bad)}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px;padding:8px;overflow:hidden;min-height:0}
@media(max-width:820px){main{display:block;overflow:auto}.panel{overflow:visible;margin-bottom:10px}.ent>*{grid-column:span 12!important}}
.ent{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.card{background:#102030;border:1px solid var(--line);border-radius:10px;padding:5px 8px 6px;min-width:0}

.row{margin-bottom:10px}

.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}

.chip.neg.on{background:var(--bad);border-color:var(--bad)}

.big{font-size:26px;font-weight:800;min-width:64px;text-align:center}
.step{display:flex;align-items:center;gap:6px}
.step .chip{font-size:20px;padding:6px 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=range]{width:100%;height:36px}
.logbtn{width:100%;padding:16px;font-size:18px;margin-top:4px}

.play:active,.play.sel{background:#223140}

.owg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.owg .chip{width:100%}.play .call{font-weight:600}.play .sub{font-size:12px;color:var(--mut)}

.badge{display:inline-block;font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px;margin-left:4px}
.b-e{background:var(--ok);color:#04210f}.b-x{background:var(--warn);color:#2a1e00}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
.modal.show{display:flex}.modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;width:min(640px,94vw);max-height:90vh;overflow:auto}

.note{color:var(--mut);font-size:12px}
.wide{width:min(920px,96vw)!important}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#102030}
.bar i{display:block;height:100%}
.c1{background:#3b9cff}.c2{background:#2fbf71}.c3{background:#5b6b7b}
.dist{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:center;margin:6px 0}
.dist .sub{font-size:12px;color:var(--mut);grid-column:2}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;text-transform:uppercase;color:var(--mut);text-align:left;padding:4px}
table.t td{padding:6px 4px;border-top:1px solid var(--line)}
.keep{color:var(--ok);font-weight:800}.stop{color:var(--bad);font-weight:800}.mid{color:var(--mut)}
.rh{font-size:15px;font-weight:800;margin:16px 0 4px}
.half{text-align:center;color:var(--warn);font-weight:800;margin:10px 0;padding:6px;border:1px dashed var(--warn);border-radius:8px}

.card .row{margin:0}

 for(const k in GLX_MAP){const m=GLX_MAP[k];for(const x of [...(DEF[k]||[]),...(L[k]||[])]){if(!String(x).trim())continue;
  const mean=DC_MEAN[m.type+'|'+x]||DC_MEAN[m.type+'|'+GL.U(x)]||(m.type==='oneword'?owText(GL.U(x)):'');
  GL.add(g,{type:m.type,name:x,side:'O',source:'seed',needsReview:!isDef(k,x),uses:m.use?[m.use]:[],meaning:{text:mean}})}}
 for(const pr of PAIRS){const a=GL.find(g,'run',pr[0])||GL.find(g,'pass',pr[0]),b=GL.find(g,'run',pr[1])||GL.find(g,'pass',pr[1]);if(a&&b){a.links.pair=b.id;b.links.pair=a.id}}

 for(const nm of Object.keys(TECH.even))if(TECH.odd[nm]&&!GL.byId(g,'front.'+GL.slug(nm)+'.even'))g.terms.push(Object.assign(GL.add(GL.blank('tmp'),{id:'front.'+GL.slug(nm)+'.even',type:'front',name:nm,side:'D',source:'seed',code:TECH.even[nm],package:'even',meaning:{text:'Even front, '+TECH.even[nm]+'.'}}).term));

function gpVocab(extra){const v=new Map(),add=(t,c)=>{t=String(t).toUpperCase().trim();if(!t)return;if(!v.has(t))v.set(t,new Set());v.get(t).add(c)};

 for(const k in extra||{})if(extra[k]&&extra[k]!=='skip')add(k,extra[k]==='tagsRun'?'tag':extra[k]);return v}
function gpTok(line,v){const w=line.toUpperCase().replace(/[^A-Z0-9 /&-]+/g,' ').split(/\s+/).filter(Boolean).map(x=>ALIAS[x]||x),out=[];for(let i=0;i<w.length;){let n=Math.min(3,w.length-i),hit=null;for(;n>=1;n--){const ph=w.slice(i,i+n).join(' ');if(v.has(ph)){hit=[ph,v.get(ph),n];break}}
  if(hit){out.push({t:hit[0],c:hit[1]});i+=hit[2]}else{out.push({t:w[i],c:null});i++}}return out}

 for(const ln of lines){const tk=gpTok(ln,v);let ci=-1;for(let i=tk.length-1;i>=0;i--)if(tk[i].c&&(tk[i].c.has('runs')||tk[i].c.has('passes')||tk[i].c.has('owcs'))){ci=i;break}
  if(ci<0&&!tk.some(x=>x.c))continue;n++;const typ=ci>=0?(tk[ci].c.has('runs')?'run':tk[ci].c.has('passes')?'pass':((OW[tk[ci].t]||{}).t||null)):null;

function buildDemo(quiet){
 let sd=20261119;const rnd=()=>{sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

 const newDrive=()=>{if(n>=26&&!half){half=true;g.plays.push({k:'h'})}else g.plays.push({k:'d'});down=1;dist=10;f=ri(20,42)};
 while(n<56){

  const p={k:'p',down,dist,f,ptype:run?'run':'pass',formation:pick(['Kong','Crown','Queen','King']),dir:pick(['RT','LT']),motion:rnd()<.3?pick(['MISSILE','X OUT','JET','ORBIT']):null,shift:rnd()<.08,jumbo:rnd()<.06,call:null,tag:rnd()<.5?pick(['NOSE','TEAR','MISS','MASH','BRONZE']):null,rgs:false,shot:false,result:'',gain:0,player:null,td:false};
  const r=rnd();
  if(run){p.call=wp(['SOONERS','CAROLINA','TEXAS','PITT','G RAIDER','HOUSTON'],[5,4,3,2,2,1]);p.rgs=rnd()<.2;p.player=wp(['4','33','0','9','12'],[10,3,1,2,1]);p.result='RUSH';
   const q=rnd();p.gain=q<.12?-ri(1,3):q<.62?ri(1,5):q<.9?ri(6,10):ri(11,22);if(r<.04){p.result='PEN';p.gain=pick([-5,5]);p.player=null}}
  else{p.call=wp(['MATCH','AGGIES','CUT CAL','RACE','BT BRONCHOS'],[4,3,3,2,2]);p.passer=wp(['12','9'],[5,1]);p.shot=rnd()<.12;p.player=wp(['11','2','5','8','13','14','15','48','30'],[4,4,3,2,2,2,2,1,1]);
   if(r<.07){p.result='SACK';p.gain=-ri(4,8);p.player=pick(['9','12'])}
   else if(r<.38){p.result='INC';p.gain=0}
   else if(r<.395){p.result='INT';p.gain=0}
   else{p.result='COMP';const q=rnd();p.gain=q<.6?ri(3,9):q<.88?ri(10,17):ri(18,40);}
   if(rnd()<.03){p.result='PEN';p.gain=pick([-5,5]);p.player=null}}
  if(p.result!=='PEN'&&p.result!=='INC'&&f+p.gain>=100){p.gain=100-f;p.td=true}
  g.plays.push(p);n++;

 else if(RF==='2h'){const i=a.findIndex(p=>p.k==='h');r=i<0?[]:a.slice(i+1)}
 else if(RF==='last'){let i=-1;a.forEach((p,j)=>{if(p.k!=='p')i=j});r=a.slice(i+1)}
 else if(RF==='last2'){const ix=[];a.forEach((p,j)=>{if(p.k!=='p')ix.push(j)});r=a.slice(ix.length>1?ix[ix.length-2]+1:0)}

 const E=N.filter(p=>eff(p)==='Y').length,X=N.filter(p=>expl(p)==='Y').length,yds=N.reduce((t,p)=>t+p.gain,0);
 const t3=N.filter(p=>p.down===3),t3c=t3.filter(p=>p.td||p.gain>=p.dist).length;
 let hit=0;const dr=drivesOf(R);for(const c of dr){let fd=0;for(let i=1;i<c.length;i++)if(c[i].down===1&&c[i-1].down!==1&&c[i-1].result!=='PEN')fd++;if(fd>=2||c.some(p=>p.td))hit++}
 const Q={};for(const p of N){if(!p.passer)continue;const q=Q[p.passer]||(Q[p.passer]={n:0,att:0,cmp:0,y:0,td:0,int:0,sk:0,sky:0,sc:0,scy:0,e:0,x:0,r:0,re:0,pp:0,pe:0});q.n++;const ef=eff(p)==='Y';if(ef)q.e++;if(expl(p)==='Y')q.x++;if(p.ptype==='run'){q.r++;if(ef)q.re++}else{q.pp++;if(ef)q.pe++};
  if(p.result==='COMP'){q.att++;q.cmp++;q.y+=p.gain;if(p.td)q.td++}else if(p.result==='INC')q.att++;else if(p.result==='INT'){q.att++;q.int++}else if(p.result==='SACK'){q.sk++;q.sky+=p.gain}else if(p.result==='SCRAM'||(p.result==='RUSH'&&p.player&&p.player===p.passer)){q.sc++;q.scy+=p.gain}}
 const T={};for(const p of N){if(!p.player)continue;const o=T[p.player]||(T[p.player]={c:0,r:0,t:0,y:0,e:0,n:0});o.n++;
  if(p.result==='RUSH'||p.result==='SCRAM'){o.c++;o.y+=p.gain}else if(p.result==='COMP'){o.r++;o.t++;o.y+=p.gain}else if(p.result==='INC'){o.t++}
  if(eff(p)==='Y')o.e++}
 const C={};for(const p of N){if(!p.call)continue;const ck=p.owc||p.call;const o=C[ck]||(C[ck]={n:0,e:0,x:0,y:0});o.n++;o.y+=p.gain;if(eff(p)==='Y')o.e++;if(expl(p)==='Y')o.x++}
 const calls=Object.entries(C).map(([k,o])=>{const ep=Math.round(100*o.e/o.n);let v='Too early';
  if(o.n>=2&&ep>=50)v='KEEP';else if((o.n>=3&&ep<35)||(o.n===2&&ep===0))v='STOP';else if(o.n>=2)v='Neutral';
  return{call:k,n:o.n,ep,avg:o.y/o.n,x:o.x,v}}).sort((a,b)=>b.n-a.n);
 const FM={};for(const p of N){if(!p.call)continue;const k=famOf(p.call),o=FM[k]||(FM[k]={n:0,e:0,x:0,y:0,calls:new Set()});o.n++;o.y+=p.gain;o.calls.add(p.call.toUpperCase());if(eff(p)==='Y')o.e++;if(expl(p)==='Y')o.x++}
 const fams=Object.entries(FM).map(([k,o])=>({fam:k,n:o.n,ep:Math.round(100*o.e/o.n),avg:o.y/o.n,x:o.x,calls:[...o.calls].join(' / ')})).sort((a,b)=>b.n-a.n);
 const GL={n:0,st:0,ste:0,se:0,see:0};for(const p of N){if(!p.glf)continue;GL.n++;if(p.glfOut){GL.se++;if(eff(p)==='Y')GL.see++}else{GL.st++;if(eff(p)==='Y')GL.ste++}}
 const OWS={};for(const p of N){if(!p.owc)continue;const o=OWS[p.owc]||(OWS[p.owc]={n:0,e:0,x:0,y:0});o.n++;o.y+=p.gain;if(eff(p)==='Y')o.e++;if(expl(p)==='Y')o.x++}
 const ows=Object.entries(OWS).map(([k,o])=>({ow:k,long:OW[k]?OW[k].fam:'',n:o.n,ep:Math.round(100*o.e/o.n),avg:o.y/o.n,x:o.x})).sort((a,b)=>b.n-a.n);
 const gp=(G().gp&&G().gp.length)?G().gp:[...A.lists.runs,...A.lists.passes,...(A.lists.owcs||[])];
 const called=new Set(G().plays.filter(p=>p.k==='p'&&(p.call||p.owc)).flatMap(p=>[p.call,p.owc]).filter(Boolean).map(x=>x.toUpperCase()));
 return{n:N.length,E,X,ep:pc(E,N.length),xp:pc(X,N.length),yp:N.length?yds/N.length:0,runs:N.filter(p=>p.ptype==='run').length,passes:N.filter(p=>p.ptype==='pass').length,t3:t3.length,t3c,fd:hit,drn:dr.length,
  Q:Object.entries(Q).sort((a,b)=>b[1].n-a[1].n),fams,ows,GL,T:Object.entries(T).sort((a,b)=>(b[1].c+b[1].r)-(a[1].c+a[1].r)||b[1].t-a[1].t),calls,notCalled:gp.filter(x=>!called.has(x.toUpperCase())),unassigned:N.filter(p=>!p.player&&['RUSH','SCRAM','COMP','INC'].includes(p.result)).length}}
const pct=v=>v==null?'–':v+'%';
function reportHtml(){const D=reportData(),mx=Math.max(1,...D.T.map(([k,o])=>o.c+o.r+(o.t-o.r)));
 const F=[['all','All'],['1h','1st half'],['2h','2nd half'],['q1','Q1'],['q2','Q2'],['q3','Q3'],['q4','Q4'],['last','Last drive'],['last2','Last 2 drives']];
 let h=`<div class="noprint" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${F.map(f=>`<button class="chip ${RF===f[0]?'on':''}" data-rf="${f[0]}">${f[1]}</button>`).join('')}<span style="flex:1"></span><button class="btn" id="rprint">Print / PDF</button><button class="btn" id="rcopy">Copy text</button></div>
 <h3 style="margin:4px 0">${G().opp} ${RMODE==='stats'?'stats':''} — ${F.find(f=>f[0]===RF)[1]}</h3>
 <div class="tiles"><div class="tile"><b>${D.n}</b><span>Plays (${D.runs}R / ${D.passes}P)</span></div><div class="tile"><b>${pct(D.ep)}</b><span>Efficient (goal 50)</span></div><div class="tile"><b>${pct(D.xp)}</b><span>Explosive (goal 12)</span></div><div class="tile"><b>${D.fd}/${D.drn}</b><span>2FDOS drives</span></div></div>
 <div class="tiles"><div class="tile"><b>${D.yp.toFixed(1)}</b><span>Yds / play</span></div><div class="tile"><b>${D.t3c}/${D.t3}</b><span>3rd down</span></div><div class="tile"><b>${D.X}</b><span>Explosives</span></div><div class="tile"><b>${D.n-D.E}</b><span>Non-efficient</span></div></div>
 <div class="rh">Who touched the ball</div>`;
 if(RMODE==='stats')return h.replace('<div class="rh">Who touched the ball</div>','')+statsTables();
 if(!D.T.length)h+='<div class="note">No players logged yet.</div>';
 for(const [k,o] of D.T){const inc=o.t-o.r;h+=`<div class="dist"><b>#${k}</b><div class="bar"><i class="c1" style="width:${100*o.c/mx}%"></i><i class="c2" style="width:${100*o.r/mx}%"></i><i class="c3" style="width:${100*inc/mx}%"></i></div><div class="sub">${o.c} carries · ${o.r} catches · ${o.t} targets · ${o.y} yds${o.c+o.r?' ('+(o.y/(o.c+o.r)).toFixed(1)+'/touch)':''} · ${Math.round(100*o.e/o.n)}% eff</div></div>`}
 h+=`<div class="note">Blue = carries, green = catches, gray = incomplete targets.  ${D.unassigned?D.unassigned+' plays have no player logged.':''}</div>`;
 h+=`<div class="rh">Passers</div>`;if(!D.Q.length)h+='<div class="note">No passer logged yet.</div>';else h+=`<table class="t"><tr><th>QB</th><th>Plays (R/P)</th><th>Run eff</th><th>Pass eff</th><th>C/A</th><th>Yds</th><th>TD</th><th>INT</th><th>Sacks</th><th>QB rush</th><th>Eff</th></tr>${D.Q.map(([k,q])=>`<tr><td>#${k}</td><td>${q.n} (${q.r}/${q.pp})</td><td>${q.r?Math.round(100*q.re/q.r)+'%':'–'}</td><td>${q.pp?Math.round(100*q.pe/q.pp)+'%':'–'}</td><td>${q.cmp}/${q.att}${q.att?' ('+Math.round(100*q.cmp/q.att)+'%)':''}</td><td>${q.y}${q.att?' ('+(q.y/q.att).toFixed(1)+'/att)':''}</td><td>${q.td}</td><td>${q.int}</td><td>${q.sk} (${q.sky})</td><td>${q.sc} (${q.scy})</td><td>${Math.round(100*q.e/q.n)}%</td></tr>`).join('')}</table>`;
 const tb=(v)=>D.calls.filter(c=>c.v===v);
 h+=`<div class="rh">Green light formations</div>${D.GL.n?`<table class="t"><tr><th>GLF</th><th>Snaps</th><th>Eff</th></tr><tr><td>Stayed in it (bubble / its own play)</td><td>${D.GL.st}</td><td>${D.GL.st?Math.round(100*D.GL.ste/D.GL.st)+"%":"–"}</td></tr><tr><td>Shifted out</td><td>${D.GL.se}</td><td>${D.GL.se?Math.round(100*D.GL.see/D.GL.se)+"%":"–"}</td></tr></table>`:'<div class="note">No green light formations yet.</div>'}
 <div class="rh">Calls: keep, stop, watch</div><table class="t"><tr><th>Call</th><th>Snaps</th><th>Eff</th><th>Avg</th><th>Exp</th><th></th></tr>${D.calls.map(c=>`<tr><td>${c.call}</td><td>${c.n}</td><td>${c.ep}%</td><td>${c.avg>0?'+':''}${c.avg.toFixed(1)}</td><td>${c.x}</td><td class="${c.v==='KEEP'?'keep':c.v==='STOP'?'stop':'mid'}">${c.v}</td></tr>`).join('')||'<tr><td colspan=6 class="note">No calls yet.</td></tr>'}</table>
 <div class="note">KEEP = 2+ snaps at 50% efficient or better. STOP = 3+ snaps under 35%, or 2 snaps with none efficient. One snap is too early to judge. Small samples, so use judgment.</div>
 <div class="rh">One words</div><table class="t"><tr><th>One word</th><th>Snaps</th><th>Eff</th><th>Avg</th><th>Exp</th></tr>${D.ows.map(c=>`<tr><td>${c.ow}</td><td>${c.n}</td><td>${c.ep}%</td><td>${c.avg>0?'+':''}${c.avg.toFixed(1)}</td><td>${c.x}</td></tr>`).join('')||'<tr><td colspan=5 class="note">No one words yet.</td></tr>'}</table>
 <div class="rh">By concept (Left/Right pairs combined)</div><table class="t"><tr><th>Concept</th><th>Calls used</th><th>Snaps</th><th>Eff</th><th>Avg</th><th>Exp</th></tr>${D.fams.map(c=>`<tr><td>${c.fam}</td><td>${c.calls}</td><td>${c.n}</td><td>${c.ep}%</td><td>${c.avg>0?'+':''}${c.avg.toFixed(1)}</td><td>${c.x}</td></tr>`).join('')||'<tr><td colspan=6 class="note">No calls yet.</td></tr>'}</table>
 <div class="rh">Not called yet (${D.notCalled.length})</div><div class="chips">${D.notCalled.map(x=>`<span class="chip" style="min-height:0;padding:4px 9px;font-weight:500">${x}</span>`).join('')||'<span class="note">Everything on the plan has been called.</span>'}</div>
 <div class="note">${G().gp&&G().gp.length?'From this week\'s gameplan list.':'No gameplan list set (Setup), so this is every run and pass button. Whole game to date.'}</div>`;
 return h}
function statsTables(){const P=rangePlays().filter(p=>p.k==='p');const N=P.filter(p=>p.result!=='PEN');
 const Q={},R={},C={};const g=(o,k,f)=>o[k]||(o[k]=f());
 for(const p of N){const pr=p.passer,pl=p.player;
  if(['COMP','INC','INT','SACK'].includes(p.result)&&pr){const q=g(Q,pr,()=>({att:0,cmp:0,y:0,td:0,int:0,sk:0,sky:0,lg:0}));
   if(p.result==='SACK'){q.sk++;q.sky+=p.gain}else{q.att++;if(p.result==='COMP'){q.cmp++;q.y+=p.gain;if(p.td)q.td++;q.lg=Math.max(q.lg,p.gain)}if(p.result==='INT')q.int++}}
  if(p.result==='RUSH'||p.result==='SCRAM'){const k=pl||(p.result==='SCRAM'?pr:null);if(k){const r=g(R,k,()=>({c:0,y:0,td:0,lg:-99,e:0,x:0}));r.c++;r.y+=p.gain;if(p.td)r.td++;r.lg=Math.max(r.lg,p.gain);if(eff(p)==='Y')r.e++;if(expl(p)==='Y')r.x++}}
  if((p.result==='COMP'||p.result==='INC')&&pl){const c=g(C,pl,()=>({tg:0,rec:0,y:0,td:0,lg:0}));c.tg++;if(p.result==='COMP'){c.rec++;c.y+=p.gain;if(p.td)c.td++;c.lg=Math.max(c.lg,p.gain)}}}
 const num=k=>k.replace(/\D/g,'')||k;const srt=(o,f)=>Object.entries(o).sort((a,b)=>f(b[1])-f(a[1]));
 const tbl=(t,hd,rows,tot)=>`<div class="rh">${t}</div>`+(rows.length?`<table class="t"><tr>${hd.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}${tot?`<tr style="font-weight:700">${tot.map(x=>`<td>${x}</td>`).join('')}</tr>`:''}</table>`:'<div class="note">None yet.</div>');
 const avg=(a,b)=>b?(a/b).toFixed(1):'–',pc=(a,b)=>b?Math.round(100*a/b)+'%':'–';
 const qs=srt(Q,q=>q.att),rs=srt(R,r=>r.c),cs=srt(C,c=>c.rec*1000+c.tg);
 const sum=(o,f)=>Object.values(o).reduce((t,x)=>t+x[f],0);
 let h=tbl('Passing',['QB','C/A','Pct','Yds','Y/A','TD','INT','Sacks','Long'],qs.map(([k,q])=>['#'+k,q.cmp+'/'+q.att,pc(q.cmp,q.att),q.y,avg(q.y,q.att),q.td,q.int,q.sk+' ('+q.sky+')',q.lg]),qs.length>1?['Team',sum(Q,'cmp')+'/'+sum(Q,'att'),pc(sum(Q,'cmp'),sum(Q,'att')),sum(Q,'y'),avg(sum(Q,'y'),sum(Q,'att')),sum(Q,'td'),sum(Q,'int'),sum(Q,'sk')+' ('+sum(Q,'sky')+')','']:null);
 h+=tbl('Rushing',['Player','Car','Yds','Avg','TD','Long','Eff','Exp'],rs.map(([k,r])=>['#'+k,r.c,r.y,avg(r.y,r.c),r.td,r.lg,pc(r.e,r.c),r.x]),rs.length>1?['Team',sum(R,'c'),sum(R,'y'),avg(sum(R,'y'),sum(R,'c')),sum(R,'td'),'','','']:null);
 h+=tbl('Receiving',['Player','Rec','Tgt','Catch %','Yds','Avg','TD','Long'],cs.map(([k,c])=>['#'+k,c.rec,c.tg,pc(c.rec,c.tg),c.y,avg(c.y,c.rec),c.td,c.lg]),cs.length>1?['Team',sum(C,'rec'),sum(C,'tg'),pc(sum(C,'rec'),sum(C,'tg')),sum(C,'y'),avg(sum(C,'y'),sum(C,'rec')),sum(C,'td'),'']:null);
 const un=N.filter(p=>['RUSH','SCRAM','COMP','INC'].includes(p.result)&&!p.player&&!(p.result==='SCRAM'&&p.passer)).length,nq=N.filter(p=>['COMP','INC','INT','SACK'].includes(p.result)&&!p.passer).length;
 if(un||nq)h+=`<div class="note">${un?un+' run/pass plays have no player logged. ':''}${nq?nq+' pass plays have no QB logged.':''}</div>`;
 const row=(l,a)=>{const e=a.filter(p=>eff(p)==='Y').length,x=a.filter(p=>expl(p)==='Y').length,y=a.reduce((t,p)=>t+p.gain,0);return `<tr><td>${l}</td><td>${a.length}</td><td>${a.length?Math.round(100*e/a.length)+'%':'–'}</td><td>${a.length?(y/a.length).toFixed(1):'–'}</td><td>${x}</td></tr>`};
 h+=`<div class="rh">Splits</div><table class="t"><tr><th></th><th>Plays</th><th>Eff</th><th>Yds/play</th><th>Exp</th></tr>${row('Run',N.filter(p=>p.ptype==='run'))}${row('Pass',N.filter(p=>p.ptype==='pass'))}${[1,2,3,4].map(n=>row(['1st','2nd','3rd','4th'][n-1]+' down',N.filter(p=>p.down===n))).join('')}</table>`;return h}
function reportText(){const D=reportData();return [G().opp+' — '+RF,`Plays ${D.n} (${D.runs}R/${D.passes}P) | Eff ${pct(D.ep)} | Exp ${pct(D.xp)} | 2FDOS ${D.fd}/${D.drn} | 3rd ${D.t3c}/${D.t3} | ${D.yp.toFixed(1)} yds/play`,'','PASSERS',...D.Q.map(([k,q])=>`#${k}: ${q.cmp}/${q.att}, ${q.y} yds, ${q.td} TD, ${q.int} INT, ${q.sk} sacks (${q.sky}), ${q.sc} rush (${q.scy}), ${Math.round(100*q.e/q.n)}% eff`),'','TOUCHES',...D.T.map(([k,o])=>`#${k}: ${o.c} car, ${o.r} rec, ${o.t} tgt, ${o.y} yds`),'','KEEP: '+(D.calls.filter(c=>c.v==='KEEP').map(c=>c.call).join(', ')||'-'),'STOP: '+(D.calls.filter(c=>c.v==='STOP').map(c=>c.call).join(', ')||'-'),'ONE WORDS: '+(D.ows.map(c=>`${c.ow} ${c.n} (${c.ep}% eff)`).join(', ')||'-'),'BY CONCEPT: '+(D.fams.map(c=>`${c.fam} ${c.n} (${c.ep}% eff)`).join(', ')||'-'),'NOT CALLED: '+(D.notCalled.join(', ')||'-')].join('\n')}
function openReport(m){RMODE=m==='stats'?'stats':'report';modal(reportHtml());document.getElementById('mbox').classList.add('wide');wireReport()}

document.getElementById('rep').onclick=()=>openReport('report');document.getElementById('stats').onclick=()=>openReport('stats');
function modal_close(){document.getElementById('modal').classList.remove('show')}
