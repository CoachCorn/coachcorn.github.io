<title>Scout Teams</title>
<style>
/* Phone-first quiz: one screen at a time, big tap targets, action bar pinned to the bottom. */
:root{
  --paper:#f2f3ef; --card:#ffffff; --ink:#15191f; --ink2:#4a525d; --line:#c9cdc4;
  --turf:#1d6b43; --turf-bg:#dcebe1; --miss:#b4491a; --miss-bg:#f5e0d4; --amber:#8a6410; --amber-bg:#f3e7c6;
  --font-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12151a; --card:#1b2028; --ink:#eceee9; --ink2:#a3abb5; --line:#343b46;
  --turf:#5fbf87; --turf-bg:#173a29; --miss:#f0905e; --miss-bg:#3d2417; --amber:#e3bd5a; --amber-bg:#3a2f12; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:400 17px/1.45 var(--font-body);-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
#app{max-width:560px;margin:0 auto;padding-top:14px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);padding:13px 14px;width:100%;min-width:0;border-radius:0;-webkit-appearance:none;appearance:none}
input{font-size:17px}
:focus-visible{outline:3px solid var(--turf);outline-offset:2px}
h1,h2{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.02}
h1{font-size:40px;font-weight:700} h2{font-size:28px;font-weight:700}
.lbl{font:600 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.muted{color:var(--ink2)} .small{font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.link{background:none;border:0;padding:10px 0;color:var(--ink2);text-decoration:underline;font-size:15px}
.chip{font:600 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;border:1.5px solid currentColor;padding:4px 7px;display:inline-block}
.panel{background:var(--card);border:2px solid var(--ink);padding:16px;margin-bottom:14px}
.btn{display:block;width:100%;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:16px 18px;min-height:56px;font:700 20px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.btn.alt{background:transparent;color:var(--ink)}
.btn.good{background:var(--turf);border-color:var(--turf);color:#fff}
.btn.bad{background:var(--miss);border-color:var(--miss);color:#fff}
.stack{display:grid;gap:10px}
.pickbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:16px;min-height:56px;border:2px solid var(--line);background:var(--card);font-weight:500;width:100%}

.meter{height:12px;background:var(--paper);border:2px solid var(--ink);position:relative}

.nums{font:500 15px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.deck{display:grid;gap:10px;text-align:left;width:100%;padding:16px;border:2px solid var(--ink);background:var(--card)}
.deck .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.diagram{background:#fff;border:2px solid var(--ink);line-height:0;margin-bottom:12px}
.diagram img{width:100%;height:auto;display:block}
.q{font:700 30px/1.08 var(--font-display);margin:10px 0 14px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:15px 14px;min-height:58px;border:2px solid var(--line);background:var(--card);font-weight:500;display:flex;gap:12px;align-items:baseline;width:100%}
.opt b{font:600 13px/1 var(--font-mono);color:var(--ink2)}
.opt.right{border-color:var(--turf);background:var(--turf-bg)}
.opt.wrong{border-color:var(--miss);background:var(--miss-bg)}
.back{margin-top:14px;border-left:6px solid var(--ink);padding:10px 14px;background:var(--card)}
.back.ok{border-color:var(--turf)} .back.no{border-color:var(--miss)}
.pips{display:flex;gap:6px}
.pip{width:16px;height:16px;border:2px solid var(--ink)}
.pip.on{background:var(--turf);border-color:var(--turf)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--paper);border-top:2px solid var(--ink)}
.dock .in{max-width:560px;margin:0 auto;display:grid;gap:10px}
.dock .in.two{grid-template-columns:1fr 1fr}
.notice{margin:0 0 14px;padding:10px 14px;border:2px solid var(--amber);background:var(--amber-bg)}
.empty{padding:22px 16px;border:2px dashed var(--line);text-align:center;color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{border:2px solid var(--ink);background:var(--card);padding:10px 12px}
.tile .n{font:700 36px/1 var(--font-display);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:430px;font-size:15px}
th{font:600 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:8px;border-bottom:2px solid var(--ink)}
td{padding:10px 8px;border-bottom:1px solid var(--line)}
td.num{font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums}
.st{font:600 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;display:inline-block}
.st.none{background:var(--miss-bg);color:var(--miss)} .st.mid{background:var(--amber-bg);color:var(--amber)} .st.done{background:var(--turf-bg);color:var(--turf)}
.clock{font:700 44px/1 var(--font-display);font-variant-numeric:tabular-nums;text-align:center}
.clock.low{color:var(--miss)}
.field{position:relative;height:34px;border:2px solid var(--ink);background:repeating-linear-gradient(90deg,var(--turf-bg) 0,var(--turf-bg) 9.4%,var(--card) 9.4%,var(--card) 10%);margin:10px 0 6px;overflow:hidden}
.field .ez{position:absolute;right:0;top:0;bottom:0;width:8px;background:var(--turf)}
.field .ball{position:absolute;top:50%;width:24px;height:14px;margin:-7px 0 0 -12px;background:var(--ink);border-radius:50%;transition:left .4s ease-out}
.pickbtn.on{border-color:var(--turf);background:var(--turf-bg)}
.pickbtn.off{opacity:.55}
.lb{width:100%;border-collapse:collapse;min-width:0;font-size:16px}
.lb td{padding:9px 6px}
.lb tr.me td{background:var(--turf-bg);font-weight:600}
.lb .rk{font:700 20px/1 var(--font-display);width:34px}
.lb .sc{font:700 22px/1 var(--font-display);text-align:right;font-variant-numeric:tabular-nums}
.lbtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
.lbtabs button{padding:10px 4px;border:2px solid var(--line);background:var(--card);font:600 13px/1 var(--font-mono);letter-spacing:.05em;text-transform:uppercase}
.lbtabs button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.hard{display:grid;gap:12px}
.hard .item{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;align-items:baseline}
.hard .pct{font:700 28px/1 var(--font-display);color:var(--miss)}

<script>
(function(){

/* ===== Where is this team's Sheet? =====
   Players open this page with ?s=<your script id> on the end (the setup guide gives you the full link).
   With no ?s= the page runs the built-in sample playbook and saves progress on this phone only. */
var DEFAULT_ENDPOINT="";
var SAMPLE={"settings": {"App name": "Scout Teams", "Team name": "Sample Team", "Positions": "QB, RB, WR, TE, OL", "Coach code": "CHANGE-ME", "Mastery streak": 3, "Mastery days": 2, "Page URL": ""}, "roster": [["Sample Quarterback", "QB"], ["Sample Back", "RB"], ["Sample Receiver", "WR"], ["Sample Tight End", "TE"], ["Sample Lineman", "OL"]], "cards": [["Base Offense", "ALL", "How many receivers are lined up on the trips side of a Trips formation?", "3", "2", "4", "1", "Trips means three receivers to one side of the ball.", ""], ["Base Offense", "ALL", "Which formation has two receivers on each side of the ball?", "Doubles", "Trips", "Empty", "Bunch", "Doubles is a 2x2 set.", ""], ["Base Offense", "ALL", "What does the word Bunch describe?", "Three receivers lined up tightly together", "Two receivers split far apart", "A back lined up behind the guard", "All five linemen on one side", "Bunch sets are often used to create natural picks and crossing routes.", ""], ["Base Offense", "ALL", "What is an Empty formation?", "No running back in the backfield", "Two tight ends and no receivers", "The quarterback under center with no one behind him", "A formation with only four linemen", "Empty puts all five eligible players out wide or on the line, so the QB is alone in the backfield.", ""], ["Base Offense", "QB, RB", "Where does the running back line up in a Pistol set?", "Directly behind the quarterback", "Beside the quarterback in the shotgun", "On the line next to the tackle", "Split wide as a receiver", "In the Pistol the QB is a few yards back and the running back lines up directly behind him.", ""], ["Base Offense", "ALL", "In this sample playbook, what does the call 'Rip' tell the offensive line to do?", "Slide protection to the right", "", "", "", "Rip means the line slides protection to the right. Liz means slide to the left.", ""], ["Base Offense", "ALL", "In this sample playbook, what does the call 'Liz' tell the offensive line to do?", "Slide protection to the left", "", "", "", "Liz means slide protection to the left. Rip means slide to the right.", ""], ["Base Offense", "QB", "In this sample playbook, what does a QB tap on the helmet mean?", "Quick snap count", "", "", "", "The QB tap on the helmet is the sample signal for a quick snap count. Change it to your own signal in the Cards tab.", ""], ["Base Offense", "ALL", "What word do you say when you change the play at the line of scrimmage?", "Your own audible word (replace this)", "", "", "", "This card is a template. Replace it with your own audible word and what it means.", ""], ["Pass Game Install", "ALL", "Which two routes make up the Smash concept?", "A corner route over a hitch route", "A post over a dig", "A go over an out", "A curl over a flat", "The hitch holds the cornerback while the corner route attacks over the top.", ""], ["Pass Game Install", "QB", "On Smash, who is the QB's key defender?", "The cornerback over the hitch route", "The middle linebacker", "The free safety", "The defensive end", "If the corner sits on the hitch, throw the corner route. If the corner drops, throw the hitch.", ""], ["Pass Game Install", "ALL", "What does the Mesh concept do?", "Two shallow routes cross each other in opposite directions", "Four receivers run straight up the field", "Two receivers run curl routes", "The tight end blocks and the back runs a go", "The crossing routes are designed to rub off or confuse man coverage.", ""], ["Pass Game Install", "WR, TE", "On Mesh, what is the key to the two crossing routes?", "Cross at different depths and stay low to the ground", "Run into the same spot at the same time", "Stop in the middle and wait for the ball", "Run a vertical route first", "Crossing at different depths keeps the defenders from covering both routes.", ""], ["Pass Game Install", "ALL", "How many receivers run vertical routes on Four Verticals?", "4", "2", "3", "5", "Four Verticals stretches the deep part of the field with four receivers running streaks or seams.", ""], ["Pass Game Install", "QB", "On Four Verticals, what do you read first?", "The deep safeties", "The nearest linebacker", "The defensive tackles", "The sideline", "The safeties tell you which vertical will be open. Throw away from a safety who is covering the route.", ""], ["Pass Game Install", "ALL", "On a Curl-Flat concept, what does the flat route do?", "Runs to the sideline at shallow depth to stretch the underneath defender", "Runs a deep post", "Stays in to block", "Runs a seam up the middle", "The flat route pulls the flat defender out so the curl has room behind him.", ""], ["Pass Game Install", "ALL", "The Stick concept features which type of route from the inside receiver?", "A short stick route, a quick stop about 5 yards deep", "A deep post", "A fade", "A wheel", "Stick is a quick-game concept designed to get the ball out fast against zone coverage.", ""], ["Pass Game Install", "QB", "On Stick, how fast should the ball come out?", "On rhythm, after a quick 3-step drop", "After holding it for five seconds", "Only after the QB scrambles", "After a full 7-step drop", "Quick-game concepts are built to be thrown in about 2 seconds.", ""], ["Pass Game Install", "WR", "A cornerback is playing off, 7 yards from you. What kind of route is usually open?", "A quick hitch or stick", "A deep go route every time", "A block on the safety", "A late curl", "Off coverage gives up the short routes, so the quick hitch or stick is usually open.", ""], ["OL Install", "OL", "A defender shows blitz over your gap. What do you do?", "Block him and pass off anyone who crosses your face", "Run to the flat", "Wait to see who comes", "Chip him and release to a route", "Stay square, keep your inside shoulder free, and communicate the blitz.", ""], ["OL Install", "RB", "Nobody rushes to your side. What is your job?", "Check release to the flat", "Stay in and block the nearest lineman", "Run a deep post", "Take the handoff", "If the back is not needed in protection, he releases as a check-down option.", ""], ["OL Install", "QB", "How many pass rushers can your five linemen block without help from the back?", "Five (the number of linemen)", "Three", "Seven", "None", "Count the rushers. If there are more than the linemen can block, the back or the QB has to account for the extra rusher.", ""]]};

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function jget(k,d){try{var v=JSON.parse(lsGet(k));return v==null?d:v}catch(e){return d}}
function endpointFrom(s){
  s=String(s||"").trim(); if(!s)return "";
  if(/^https:\/\/script\.google\.com\//.test(s))return s;
  if(/^[A-Za-z0-9_-]{20,}$/.test(s))return "https://script.google.com/macros/s/"+s+"/exec";
  return "";
}
var ENDPOINT=(function(){
  var m=/[?&]s=([^&#]+)/.exec(location.search), ep="";
  if(m){try{ep=endpointFrom(decodeURIComponent(m[1]))}catch(e){}}
  if(ep){lsSet("cs.ep",ep);return ep}
  return endpointFrom(lsGet("cs.ep"))||endpointFrom(DEFAULT_ENDPOINT);
})();
var HOSTED=!!(window.google&&google.script&&google.script.run);   /* page is being served by the Apps Script itself */
var ONLINE=!!(ENDPOINT||HOSTED);
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
var NS="cs:"+hash(ENDPOINT||(HOSTED?"hosted":"demo"))+":";

/* ===== Config (settings + cards) =====
   Cached on the phone so the app opens instantly and works offline; refreshed from the Sheet every time it opens. */
var cfg=null;
function cleanCfg(c){
  if(!c||!Array.isArray(c.cards))return null;
  var pos=(c.positions&&c.positions.length?c.positions:["ALL"]).map(function(p){return String(p).trim()}).filter(Boolean);
  var cards=c.cards.map(function(x){
    var wrong=(x.wrong||[]).map(function(w){return String(w).trim()}).filter(Boolean);
    var p=(x.pos&&x.pos.length?x.pos:["ALL"]).map(function(v){return String(v).trim().toUpperCase()}).filter(Boolean);
    return {id:String(x.id),deck:String(x.deck||"General"),pos:p.length?p:["ALL"],q:String(x.q||""),a:String(x.a||""),wrong:wrong,back:String(x.back||""),img:String(x.img||"")};
  }).filter(function(x){return x.id&&x.q&&x.a});
  var decks=[];cards.forEach(function(x){if(decks.indexOf(x.deck)<0)decks.push(x.deck)});
  return {name:String(c.name||"Scout Teams"),team:String(c.team||""),positions:pos,streak:+c.streak||3,days:+c.days||2,cards:cards,decks:decks};
}
function sampleCfg(){
  var s=SAMPLE.settings;
  return cleanCfg({name:s["App name"],team:s["Team name"],positions:String(s["Positions"]).split(","),streak:s["Mastery streak"],days:s["Mastery days"],
    cards:SAMPLE.cards.map(function(r,i){return {id:"sample-"+(i+1),deck:r[0],pos:String(r[1]).split(","),q:r[2],a:r[3],wrong:[r[4],r[5],r[6]],back:r[7],img:r[8]}})});
}
function applyCfg(c){
  cfg=c;
  MASTER.streak=c.streak;MASTER.days=c.days;
  document.title=c.name;
  var m=document.querySelector('meta[name="apple-mobile-web-app-title"]');if(m)m.setAttribute("content",c.name);
}
var MASTER={streak:3,days:2};
/* Most Missed: a card needs this many attempts (and at least one miss) before it can be ranked. */
var MISS_MIN_TEAM=5, MISS_MIN_ME=3;
var mineIds=[];

/* ===== Helpers ===== */
var $app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function normDay(d,t){var s=String(d==null?"":d),m=s.match(/^(\d{4}-\d{2}-\d{2})/);if(m)return m[1];var ms=Date.parse(s);if(isNaN(ms))ms=+t;if(!ms)return "";var x=new Date(ms);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function daysAgo(s){if(!s)return "Never";var a=new Date(s+"T00:00:00"),b=new Date(today()+"T00:00:00");var n=Math.round((b-a)/864e5);return n<=0?"Today":n===1?"Yesterday":n+" days ago"}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function np(p){return String(p||"").trim().toUpperCase()}
function posLabel(p){
  if(!cfg)return p;
  var u=np(p);for(var i=0;i<cfg.positions.length;i++)if(np(cfg.positions[i])===u)return cfg.positions[i];
  return String(p||"");
}
function imgSrc(u){
  u=String(u||"").trim(); if(!u)return "";
  var m=/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/.exec(u)||/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([A-Za-z0-9_-]+)/.exec(u);
  if(m)return "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1200";
  return /^https:\/\//.test(u)?u:"";
}
function cardsFor(pos,deck){
  if(!cfg)return [];
  if(deck==="__mine")return cfg.cards.filter(function(c){return mineIds.indexOf(c.id)>-1});
  if(deck==="__drill")return cfg.cards.filter(function(c){return drillMissed.indexOf(c.id)>-1});
  var p=np(pos);
  return cfg.cards.filter(function(c){return (c.pos.indexOf("ALL")>-1||c.pos.indexOf(p)>-1)&&(!deck||c.deck===deck)});
}
function derive(evs){
  var m={};
  evs.slice().sort(function(a,b){return a.t-b.t}).forEach(function(e){
    if(e.dr)return;   /* 2 Min Drill answers never count toward mastery */
    var x=m[e.c]||(m[e.c]={s:0,d:[],r:0,w:0,m:false});
    if(e.ok){x.r++;x.s++;if(x.d.indexOf(e.d)<0)x.d.push(e.d);if(x.s>=MASTER.streak&&x.d.length>=MASTER.days)x.m=true}
    else{x.w++;x.s=0;x.d=[]}
  });
  return m;
}
function st(m,id){return m[id]||{s:0,d:[],r:0,w:0,m:false}}
function myMissed(m){
  var l=[];
  cardsFor(me.pos).forEach(function(c){var x=st(m,c.id),t=x.r+x.w;if(x.w>0&&t>=MISS_MIN_ME)l.push({c:c,w:x.w,t:t,rate:x.w/t})});
  l.sort(function(a,b){return b.rate-a.rate||b.t-a.t});
  return l.slice(0,12);
}
function mastered(m,pos,deck){var n=0;cardsFor(pos,deck).forEach(function(c){if(st(m,c.id).m)n++});return n}

/* ===== State ===== */

var queue=jget(NS+"queue",[]);

function evKey(){return NS+"ev."+me.name.toLowerCase()}
function saveEvents(){lsSet(evKey(),JSON.stringify(events))}

/* ===== Network ===== */
function getJSON(params){
  var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k])}).join("&");
  if(HOSTED)return new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(rej).apiGet(params)});
  return fetch(ENDPOINT+(ENDPOINT.indexOf("?")>-1?"&":"?")+qs).then(function(r){return r.json()});
}
function postJSON(obj){
  if(HOSTED)return new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(rej).apiPost(JSON.stringify(obj))});
  return fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)}).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.text()});
}
function flush(){
  if(!ONLINE||flushing||!queue.length)return;
  flushing=true;
  (function next(){
    if(!queue.length){flushing=false;return}
    postJSON(queue[0]).then(function(){queue.shift();lsSet(NS+"queue",JSON.stringify(queue));next()}).catch(function(){flushing=false});
  })();
}
window.addEventListener("online",flush);
function loadConfig(){
  if(!ONLINE)return;
  cfgErr=false;
  getJSON({action:"config"}).then(function(c){
    if(c&&c.error)throw new Error(c.error);
    var n=cleanCfg(c);if(!n)throw new Error("The Sheet returned no cards. Check the Cards tab.");
    lsSet(NS+"cfg",JSON.stringify(c));
    applyCfg(n);
    if(view!=="quiz")render();
  }).catch(function(err){cfgErr=String((err&&(err.message||err))||"unknown");if(!cfg||view==="login")render()});
}
function loadRoster(){
  if(!ONLINE)return;
  roster=null;rosterErr=false;
  getJSON({action:"roster"}).then(function(r){roster=Array.isArray(r)?r.map(function(x){return {name:x.name,pos:np(x.pos)}}):[];if(view==="login")render()}).catch(function(err){rosterErr=String((err&&(err.message||err))||"unknown");roster=[];if(view==="login")render()});
}

/* ===== Views ===== */
function posSelect(){return '<select id="ps">'+cfg.positions.filter(function(p){return np(p)!=="ALL"}).map(function(p){return '<option value="'+esc(np(p))+'">'+esc(p)+'</option>'}).join("")+'</select>'}
function addSelfPanel(title){
  return '<div class="panel">'+(title?'<h2 style="font-size:22px;margin-bottom:12px">'+title+'</h2>':'')+'<div class="stack"><div><label class="lbl" for="nm">Your name</label><input id="nm" type="text" autocomplete="name" autocapitalize="words"></div><div><label class="lbl" for="ps">Position</label>'+posSelect()+'</div><button class="btn" data-act="newme">Start</button></div></div>';
}
function loginView(){
  if(!cfg){
    return '<h1>Loading…</h1>'+(cfgErr?'<div class="notice" style="margin-top:14px">Could not load the playbook. Check your signal and try again.<div class="small muted" style="margin-top:6px">Detail: '+esc(cfgErr)+'</div></div><button class="btn alt" data-act="retry">Try again</button>':'<p class="muted">Loading your playbook…</p>');
  }
  var h='<div class="top"><span class="lbl">'+esc(cfg.team)+'</span></div><h1>'+esc(cfg.name)+'</h1><p class="muted" style="margin:8px 0 18px">Quiz yourself on every play. Pick your name to start.</p>';
  if(!ONLINE){
    h+='<div class="notice small">Demo mode with a sample playbook. Progress is saved on this phone only.</div>';
    h+=addSelfPanel("");
    return h;
  }
  if(cfgErr)h+='<div class="notice small">Showing the last saved playbook. Could not reach the Sheet just now.</div>';
  if(roster===null&&!rosterErr)return h+'<div class="empty">Loading the roster…</div>';
  if(rosterErr)h+='<div class="notice">Could not load the roster. Check your signal, or add yourself below.<div class="small muted" style="margin-top:6px">Detail: '+esc(String(rosterErr))+'</div></div>';
  if(roster&&roster.length){
    h+='<div class="panel"><label class="lbl" for="flt">Find your name</label><input id="flt" type="text" autocomplete="off" value="'+esc(filter)+'" style="margin:8px 0 12px"><div class="stack" id="rlist">'+rosterList()+'</div></div>';
  } else if(roster){
    h+='<div class="empty" style="margin-bottom:14px">No names on the roster yet. Add yourself below.</div>';
  }
  h+=addSelfPanel("Not on the list?");
  h+='<p style="text-align:center"><button class="link" data-act="coach">Coach view</button></p>';
  return h;
}
function rosterList(){
  var f=filter.trim().toLowerCase();
  var l=(roster||[]).filter(function(r){return !f||r.name.toLowerCase().indexOf(f)>-1});
  if(!l.length)return '<p class="muted small" style="margin:0">No match.</p>';
  return l.map(function(r){return '<button class="pickbtn" data-act="pick" data-n="'+esc(r.name)+'" data-p="'+esc(r.pos)+'"><span>'+esc(r.name)+'</span><span class="chip">'+esc(posLabel(r.pos))+'</span></button>'}).join("");
}
function homeView(){
  var m=derive(events);
  var h='<div class="top"><div><div class="lbl">Signed in as</div><div style="font-weight:600;font-size:19px">'+esc(me.name)+' <span class="chip">'+esc(posLabel(me.pos))+'</span></div></div><button class="link" data-act="logout">Not you?</button></div>';
  if(!ONLINE)h+='<div class="notice small">Progress is saved on this phone only. Your coach cannot see it.</div>';
  h+='<h1 style="margin-bottom:14px">Your decks</h1><div class="stack">';
  var any=false;
  cfg.decks.forEach(function(d){

  if(drillPool(null).length)h+='<button class="deck" data-act="drillsetup"><div class="row"><h2>2 Min Drill</h2><span class="nums">Best '+(+lsGet(bestKey())||0)+'</span></div><div class="small muted">Race the clock. Right answers move the ball.</div></button>';

  return h;
}
function nextCard(){
  var m=derive(events), all=cardsFor(me.pos,deck), pool=all.filter(function(c){return !st(m,c.id).m}), review=false;
  if(!pool.length){pool=all;review=true}
  var bag=[];
  pool.forEach(function(c){
    if(pool.length>1&&c.id===lastCard)return;
    var x=st(m,c.id), w=1+(x.w>x.r?2:0)+(x.s===0&&x.w>0?2:0)+(x.r+x.w===0?1:0);
    for(var k=0;k<w;k++)bag.push(c);
  });
  var card=bag[Math.floor(Math.random()*bag.length)]||pool[0];
  lastCard=card.id;
  var flip=card.wrong.length===0;
  cur={card:card,flip:flip,order:flip?[]:shuffle([card.a].concat(shuffle(card.wrong).slice(0,3))),picked:null,shown:false,review:review};
}

  return h+'</div>';
}

    h+='</tbody></table></div>';

  var below=stats.filter(function(s){return s.t<MISS_MIN_TEAM}).length;
  stats=stats.filter(function(s){return s.t>=MISS_MIN_TEAM});

  if(!stats.length)h+='<div class="empty">No card has '+MISS_MIN_TEAM+' attempts with a miss yet.</div>';
  else h+='<div class="hard">'+stats.slice(0,8).map(function(s){return '<div class="item"><span class="pct">'+Math.round(s.w/s.t*100)+'%</span><span>'+esc(s.c.q)+' <b>→ '+esc(s.c.a)+'</b> <span class="muted small">('+esc(s.c.pos.join(", "))+' · '+s.w+' missed of '+s.t+')</span></span></div>'}).join("")+'</div>';
  if(below)h+='<p class="small muted" style="margin:12px 0 0">'+below+' more card'+(below===1?' has':'s have')+' misses but fewer than '+MISS_MIN_TEAM+' attempts so far.</p>';
  h+='</div>'+boardHtml()+'<button class="btn alt" data-act="coachgo">Refresh</button>';
  return h;
}

/* ===== 2 Min Drill ===== */
var DRILL_SECS=120;
var drill=null, drillTimer=null, drillAdv=null;
var lb={rows:null,err:false,tab:"today",mine:null,set:"mix",manual:false};
var drillMissed=[];
function bestKey(){return NS+"best."+me.name.toLowerCase()}
function ytxt(y){y=Math.round(y);return y<=50?"Own "+y:"Opp "+(100-y)}
function fmtClock(ms){var s=Math.ceil(Math.max(0,ms)/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function drillStop(){if(drillTimer){clearInterval(drillTimer);drillTimer=null}if(drillAdv){clearTimeout(drillAdv);drillAdv=null}}
/* Drills use multiple choice cards only. Flip cards have no options to tap. */
function drillPool(d){return cardsFor(me.pos,d).filter(function(c){return c.wrong.length>0})}
function selSet(){var sel=cfg.decks.filter(function(d){return drill&&drill.decks&&drill.decks[d]&&drillPool(d).length});return sel.length===1?sel[0]:"mix"}
function setName(id){return id==="mix"?"Mixed (2+ decks)":id}
function weekStart(){var d=new Date();var k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function loadBoard(){
  if(!ONLINE)return;
  lb.err=false;
  getJSON({action:"leaderboard"}).then(function(r){
    if(!Array.isArray(r))throw new Error("no board");
    lb.rows=r;if((view==="drill"&&drill&&drill.phase!=="play")||view==="coach")render();
  }).catch(function(){lb.err=true;if(lb.rows===null)lb.rows=[];if((view==="drill"&&drill&&drill.phase!=="play")||view==="coach")render()});
}
function boardRows(){
  var rows=(lb.rows||[]).slice();
  if(lb.mine&&!rows.some(function(r){return r.did===lb.mine.did}))rows.push(lb.mine);
  var t=today(), ws=weekStart();
  rows=rows.filter(function(r){return (r.set||"mix")===lb.set});
  rows=rows.filter(function(r){return lb.tab==="all"||(lb.tab==="today"?r.day===t:r.day>=ws)});
  var best={};
  rows.forEach(function(r){var k=r.name.toLowerCase();if(!best[k]||r.score>best[k].score)best[k]=r});
  return Object.keys(best).map(function(k){return best[k]}).sort(function(a,b){return b.score-a.score||b.td-a.td||a.t-b.t});
}
function boardHtml(){
  if(!ONLINE)return "";
  var h='<div class="panel"><h2 style="font-size:22px;margin-bottom:10px">Leaderboard</h2><label class="lbl" for="lbset">Set</label><select id="lbset" style="margin:6px 0 12px">';
  cfg.decks.concat(["mix"]).forEach(function(id){h+='<option value="'+esc(id)+'"'+(lb.set===id?' selected':'')+'>'+esc(setName(id))+'</option>'});
  h+='</select><div class="lbtabs">';
  [["today","Today"],["week","This week"],["all","All time"]].forEach(function(x){h+='<button class="'+(lb.tab===x[0]?'on':'')+'" data-act="lbtab" data-id="'+x[0]+'">'+x[1]+'</button>'});
  h+='</div>';
  if(lb.rows===null)return h+'<p class="muted small" style="margin:0">Loading…</p></div>';
  var rows=boardRows(), mine=me?me.name.toLowerCase():"";
  if(!rows.length)h+='<p class="muted small" style="margin:0">'+(lb.err?'Could not load the board. ':'')+'No scores yet. Be the first on the board.</p>';
  else{
    var myi=-1;rows.forEach(function(r,i){if(r.name.toLowerCase()===mine)myi=i});
    var row=function(r,i){return '<tr'+(r.name.toLowerCase()===mine?' class="me"':'')+'><td class="rk">'+(i+1)+'</td><td>'+esc(r.name)+' <span class="muted small">'+esc(posLabel(r.pos))+'</span><div class="muted small">'+r.td+' TD · '+(r.ans?Math.round(r.right/r.ans*100):0)+'% · streak '+r.longest+'</div></td><td class="sc">'+r.score+'</td></tr>'};
    h+='<table class="lb"><tbody>';
    rows.slice(0,10).forEach(function(r,i){h+=row(r,i)});
    if(myi>=10)h+='<tr><td colspan="3" class="muted small" style="text-align:center">…</td></tr>'+row(rows[myi],myi);
    h+='</tbody></table>';
    if(mine&&myi<0)h+='<p class="muted small" style="margin:8px 0 0">Run a drill to get on this board.</p>';
  }
  return h+'<p class="muted small" style="margin:10px 0 0">Best single drill per player. Each deck has its own board. A drill on 2 or more decks counts toward Mixed.</p></div>';
}
function drillPick(){
  var m=derive(events), pool=drill.pool, bag=[];
  pool.forEach(function(c){
    if(pool.length>1&&c.id===lastCard)return;
    var x=st(m,c.id), w=1+(x.w>x.r?2:0)+(x.s===0&&x.w>0?2:0)+(x.r+x.w===0?1:0);
    for(var k=0;k<w;k++)bag.push(c);
  });
  var card=bag[Math.floor(Math.random()*bag.length)]||pool[0];
  lastCard=card.id;
  drill.cur={card:card,order:shuffle([card.a].concat(shuffle(card.wrong).slice(0,3))),picked:null};
}
function drillSetup(){
  drillStop();
  var d={};cfg.decks.forEach(function(x){d[x]=drillPool(x).length>0});
  drill={phase:"setup",decks:d,err:""};view="drill";cur=null;lb.mine=null;lb.manual=false;lb.set=selSet();render();window.scrollTo(0,0);loadBoard();
}
function drillStart(){
  var pool=drillPool(null).filter(function(c){return drill.decks[c.deck]});
  if(!pool.length){drill.err="Pick at least one deck.";render();return}
  drillStop();
  drill={phase:"play",set:selSet(),decks:drill.decks,pool:pool,end:Date.now()+DRILL_SECS*1000,yard:25,prev:25,score:0,td:0,streak:0,longest:0,ans:0,right:0,missed:{},missOrder:[],flash:""};
  drillPick();
  drillTimer=setInterval(drillTick,200);
  view="drill";render();window.scrollTo(0,0);
}
function drillTick(){
  if(!drill||drill.phase!=="play"){drillStop();return}
  var left=drill.end-Date.now();
  if(left<=0){drillEnd();return}
  var c=document.getElementById("clock"),b=document.getElementById("clockbar");
  if(c){c.textContent=fmtClock(left);c.className="clock"+(left<=15000?" low":"")}
  if(b)b.style.width=(left/(DRILL_SECS*1000)*100)+"%";
}
function drillEnd(){
  drillStop();
  var best=+lsGet(bestKey())||0, nb=drill.ans>0&&drill.score>best;
  if(nb)lsSet(bestKey(),String(drill.score));
  drill.phase="end";drill.best=nb?drill.score:best;drill.newBest=nb;
  if(drill.ans>0){
    var t=Date.now(), did="dd-"+t+"-"+Math.random().toString(36).slice(2,7);
    lb.mine={set:drill.set,name:me.name,pos:me.pos,score:drill.score,td:drill.td,ans:drill.ans,right:drill.right,longest:drill.longest,day:today(),did:did,t:t};
    if(ONLINE){queue.push({type:"drill",did:did,t:t,name:me.name,pos:me.pos,score:drill.score,td:drill.td,ans:drill.ans,right:drill.right,longest:drill.longest,day:today(),set:drill.set});lsSet(NS+"queue",JSON.stringify(queue));flush()}
    lb.tab="today";lb.set=drill.set;
    setTimeout(loadBoard,2500);
  }
  render();window.scrollTo(0,0);
}
function drillAnswer(i){
  if(!drill||drill.phase!=="play"||drill.cur.picked!==null||Date.now()>=drill.end)return;
  var cu=drill.cur, ok=cu.order[i]===cu.card.a?1:0, t=Date.now();
  cu.picked=i;
  /* "dr-" prefix on the event id marks a drill answer everywhere it is stored, so it never counts toward mastery or Most Missed */
  var ev={id:"dr-"+t+"-"+Math.random().toString(36).slice(2,7),t:t,c:cu.card.id,ok:ok,d:today(),dr:1};
  events.push(ev);saveEvents();
  if(ONLINE){queue.push({type:"answer",eid:ev.id,t:t,name:me.name,pos:me.pos,card:ev.c,ok:ok,day:ev.d,mode:"drill"});lsSet(NS+"queue",JSON.stringify(queue));flush()}
  drill.ans++;drill.prev=drill.yard;
  if(ok){
    drill.right++;drill.streak++;if(drill.streak>drill.longest)drill.longest=drill.streak;
    var g=drill.streak>=5?16:drill.streak>=3?12:8;
    drill.yard=Math.min(100,drill.yard+g);drill.score+=g;drill.flash="+"+g+" yds";
    if(drill.yard>=100){drill.td++;drill.score+=20;drill.flash="Touchdown! +"+(g+20)}
  }else{
    drill.streak=0;drill.flash="Incomplete";
    if(!drill.missed[cu.card.id]){drill.missed[cu.card.id]=1;drill.missOrder.push(cu.card.id)}
  }
  render();
  if(drillAdv)clearTimeout(drillAdv);
  drillAdv=setTimeout(drillAdvance,ok?650:2400);
}
function drillAdvance(){
  drillAdv=null;
  if(!drill||drill.phase!=="play"||Date.now()>=drill.end)return;
  if(drill.yard>=100)drill.yard=25;
  drill.prev=drill.yard;drill.flash="";
  drillPick();render();
}

    return h;
  }
  var left=Math.max(0,D.end-Date.now()), cu=D.cur, card=cu.card, ok=cu.picked!==null&&cu.order[cu.picked]===card.a;
  h+='<div class="top"><button class="link" data-act="dquit">Quit</button><div class="clock'+(left<=15000?' low':'')+'" id="clock">'+fmtClock(left)+'</div><span class="nums">Score '+D.score+'</span></div>';
  h+='<div class="meter"><i id="clockbar" style="width:'+(left/(DRILL_SECS*1000)*100)+'%"></i></div>';
  h+='<div class="field" aria-hidden="true"><i class="ez"></i><i class="ball" id="ball" style="left:'+D.prev+'%"></i></div>';
  h+='<div class="nums" style="display:flex;justify-content:space-between;gap:8px;margin-bottom:12px"><span style="white-space:nowrap">Ball on '+ytxt(D.yard)+'</span><span style="white-space:nowrap">Streak '+D.streak+'</span><span style="white-space:nowrap;text-align:right;min-width:110px">'+esc(D.flash||"")+'</span></div>';
  var src=imgSrc(card.img);
  if(src)h+='<div class="diagram"><img src="'+esc(src)+'" alt="Diagram" onerror="this.parentNode.style.display=\'none\'"></div>';
  h+='<div class="q">'+esc(card.q)+'</div><div class="opts">';
  cu.order.forEach(function(o,i){
    var cls="opt";
    if(cu.picked!==null){if(o===card.a)cls+=" right";else if(i===cu.picked)cls+=" wrong"}
    h+='<button class="'+cls+'" data-act="dopt" data-i="'+i+'"><b>'+"ABCD"[i]+'</b><span>'+esc(o)+'</span></button>';
  });
  h+='</div>';
  if(cu.picked!==null&&!ok)h+='<div class="back no"><div class="lbl">Missed. Answer: '+esc(card.a)+'</div></div><div class="dock"><div class="in"><button class="btn" data-act="dnext">Next card</button></div></div>';
  return h;
}
function render(){
  var h=view==="login"?loginView():(!cfg?loginView():view==="home"?homeView():view==="quiz"?quizView():view==="drill"?drillView():coachView());
  $app.innerHTML=h;
  if(view==="quiz"&&cur&&(cur.picked!==null||cur.shown)){var b=document.getElementById("back");if(b&&b.scrollIntoView)b.scrollIntoView({block:"center"})}
}

/* ===== Actions ===== */
function signIn(name,pos){
  pos=np(pos);me={name:name.trim(),pos:pos};lsSet(NS+"me",JSON.stringify(me));
  events=jget(evKey(),[]);
  view="home";cur=null;render();
  if(ONLINE){
    getJSON({action:"progress",name:me.name}).then(function(rows){
      if(!Array.isArray(rows))return;
      var have={};events.forEach(function(e){have[e.id]=1});
      rows.forEach(function(r){if(!have[r.eid]){events.push({id:r.eid,t:+r.t||Date.parse(r.ts)||0,c:r.card,ok:+r.ok,d:normDay(r.day,+r.t||Date.parse(r.ts)||0),dr:String(r.eid).indexOf("dr-")===0?1:0});have[r.eid]=1}});
      saveEvents();
      if(view==="home")render();
    }).catch(function(){});
  }
  flush();
}
function record(ok){
  var t=Date.now();
  var ev={id:t+"-"+Math.random().toString(36).slice(2,7),t:t,c:cur.card.id,ok:ok,d:today()};
  events.push(ev);saveEvents();
  if(ONLINE){queue.push({type:"answer",eid:ev.id,t:t,name:me.name,pos:me.pos,card:ev.c,ok:ok,day:ev.d});lsSet(NS+"queue",JSON.stringify(queue));flush()}
}
function answer(i){
  if(cur.picked!==null)return;
  cur.picked=i;
  record(cur.order[i]===cur.card.a?1:0);
  render();
}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-act]"); if(!b)return;
  var a=b.getAttribute("data-act");
  if(a==="pick"){signIn(b.getAttribute("data-n"),b.getAttribute("data-p"))}
  else if(a==="newme"){
    var nm=document.getElementById("nm").value; if(nm.trim().length<2){document.getElementById("nm").focus();return}
    var ps=document.getElementById("ps").value;
    if(ONLINE){queue.push({type:"player",name:nm.trim(),pos:ps});lsSet(NS+"queue",JSON.stringify(queue))}
    signIn(nm,ps);
  }
  else if(a==="deck"){deck=b.getAttribute("data-id");cur=null;view="quiz";render();window.scrollTo(0,0)}
  else if(a==="mine"){var mm2=myMissed(derive(events));if(!mm2.length)return;mineIds=mm2.map(function(x){return x.c.id});deck="__mine";cur=null;view="quiz";render();window.scrollTo(0,0)}
  else if(a==="drillsetup"){drillSetup()}
  else if(a==="dtoggle"){var di=b.getAttribute("data-id");if(drill&&drillPool(di).length){drill.decks[di]=!drill.decks[di];drill.err="";if(!lb.manual)lb.set=selSet();render()}}
  else if(a==="dstart"||a==="dagain"){drillStart()}
  else if(a==="dopt"){drillAnswer(+b.getAttribute("data-i"))}
  else if(a==="dnext"){if(drillAdv){clearTimeout(drillAdv);drillAdv=null}drillAdvance()}
  else if(a==="dquit"){drillStop();drill=null;view="home";render();window.scrollTo(0,0)}
  else if(a==="dmiss"){drillMissed=drill.missOrder.slice();deck="__drill";cur=null;view="quiz";render();window.scrollTo(0,0)}
  else if(a==="lbtab"){lb.tab=b.getAttribute("data-id");render()}
  else if(a==="home"){drillStop();view="home";cur=null;render();window.scrollTo(0,0)}
  else if(a==="opt"){answer(+b.getAttribute("data-i"))}
  else if(a==="show"){cur.shown=true;render()}
  else if(a==="flip"){if(cur.picked!==null)return;cur.picked=+b.getAttribute("data-ok");record(cur.picked);render()}
  else if(a==="next"){nextCard();render();window.scrollTo(0,0)}
  else if(a==="retry"){loadConfig();render()}
  else if(a==="logout"){drillStop();drill=null;me=null;lsSet(NS+"me","");events=[];cur=null;coachData=null;view="login";render();loadRoster();loadConfig()}
  else if(a==="coach"){view="coach";render()}
  else if(a==="coachgo"){
    var c=document.getElementById("code"); var code=c?c.value:lsGet("cs.code")||"";
    coachMsg="";
    getJSON({action:"all",code:code}).then(function(d){
      if(d&&d.error){coachMsg="That code did not work.";coachData=null}
      else{d.roster=d.roster.map(function(x){return {name:x.name,pos:np(x.pos)}});d.log=d.log.map(function(x){x.pos=np(x.pos);return x});coachData=d;lsSet("cs.code",code);lb.rows=null;loadBoard()}
      render();
    }).catch(function(){coachMsg="Could not reach the Sheet.";render()});
  }
});
document.addEventListener("change",function(e){if(e.target&&e.target.id==="lbset"){lb.set=e.target.value;lb.manual=true;render()}});
document.addEventListener("input",function(e){
  if(e.target&&e.target.id==="flt"){filter=e.target.value;var l=document.getElementById("rlist");if(l)l.innerHTML=rosterList()}
});

/* ===== Boot ===== */
(function boot(){
  var cached=ONLINE?cleanCfg(jget(NS+"cfg",null)):sampleCfg();
  if(cached)applyCfg(cached);
  if(location.hash==="#coach")view="coach";
  else if(me&&me.name){events=jget(evKey(),[]);view="home"}
  render();
  if(ONLINE){
    loadConfig();
    if(view==="login")loadRoster();
    if(view==="home")signIn(me.name,me.pos);
    flush();
  }
})();
})();
</script>
